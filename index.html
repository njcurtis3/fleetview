<style>
  :root{
    --bg:#090909; --panel:#101010; --panel2:#151515; --line:rgba(255,255,255,.08);
    --fg:#f2f2f2; --muted:#dbdbdb; --dim:#6f6f6f;
    --accent:#aeaeae; --accent2:#22e2ff; --ok:#39ff9d; --warn:#ffb020; --bad:#ff3d7f; --idle:#5a5a5a;
    --glow-a:0 0 10px rgba(174,174,174,.55), 0 0 26px rgba(174,174,174,.22);
    --glow-c:0 0 10px rgba(34,226,255,.5), 0 0 24px rgba(34,226,255,.2);
    --mono:'JetBrains Mono',ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:'Inter',ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;
    background:var(--bg);
    background-attachment:fixed;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;mix-blend-mode:overlay;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 3px);
    opacity:.5;
  }
  a{color:var(--accent2)}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  ::selection{background:rgba(174,174,174,.4);color:#fff}

  header{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:14px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(11,11,11,.92), rgba(9,9,9,.92));
    backdrop-filter:blur(6px);
    box-shadow:0 1px 0 rgba(174,174,174,.15), 0 4px 24px rgba(0,0,0,.4);
    position:sticky;top:0;z-index:20;
  }
  .brand{
    font-weight:700;letter-spacing:.04em;display:flex;align-items:baseline;gap:9px;
    font-family:var(--mono);text-transform:uppercase;font-size:14px;
    color:#f6f6f6;text-shadow:0 0 8px rgba(174,174,174,.9), 0 0 22px rgba(174,174,174,.4);
  }
  .brand::before{content:"▸";color:var(--accent2);text-shadow:0 0 8px rgba(34,226,255,.9);margin-right:1px}
  .brand small{font-weight:400;color:var(--muted);font-size:11px;text-shadow:none;text-transform:none;letter-spacing:.02em}
  .tabs{display:flex;gap:2px;margin-left:8px}
  .tab{padding:6px 14px;border-radius:7px;color:var(--muted);font-size:12.5px;font-family:var(--mono);letter-spacing:.03em;text-transform:uppercase;transition:color .15s,box-shadow .15s}
  .tab:hover{color:var(--fg);background:rgba(174,174,174,.08)}
  .tab[aria-selected=true]{
    background:rgba(174,174,174,.12);color:#fff;
    box-shadow:inset 0 0 0 1px var(--accent), 0 0 12px rgba(174,174,174,.35);
    text-shadow:0 0 8px rgba(174,174,174,.6);
  }
  .spacer{flex:1}
  .ctl{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
  .ctl button{padding:6px 12px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font-size:11.5px;font-family:var(--mono);letter-spacing:.02em;text-transform:uppercase;transition:all .15s}
  .ctl button:hover{color:var(--fg);background:rgba(174,174,174,.1);box-shadow:inset 0 0 0 1px var(--accent)}
  .ctl button.on{color:var(--accent2);box-shadow:inset 0 0 0 1px var(--accent2),0 0 10px rgba(34,226,255,.35);text-shadow:0 0 6px rgba(34,226,255,.6)}

  /* ---- work-graph panel header: fullscreen + pop-out ---- */
  .panelhead2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 4px}
  .panelhead2 h2{margin:0}
  .paneicons{display:flex;gap:6px;flex:none}
  .paneicon-btn{
    padding:5px 10px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--line);color:var(--dim);
    background:transparent;font-family:var(--mono);font-size:11px;letter-spacing:.02em;
    text-transform:uppercase;transition:all .15s;flex:none;cursor:pointer;
  }
  .paneicon-btn:hover{color:var(--fg);background:rgba(174,174,174,.1);box-shadow:inset 0 0 0 1px var(--accent)}
  #graphpanel:fullscreen{background:var(--bg);width:100vw;height:100vh;padding:26px 30px;overflow:auto;box-shadow:none}

  main{display:none;padding:22px}
  main.active{display:block}

  /* ---- runs layout ---- */
  .runs-wrap{display:grid;grid-template-columns:minmax(230px,290px) 1fr;gap:22px;align-items:start}
  /* Pinned explicitly: display:none removes .runlist-col from grid placement
     entirely, and with it gone, auto-placement would slide #rundetail into
     column 1 instead of leaving it in column 2 -- the whole page then renders
     inside what was meant to be the collapsed sliver. */
  .runlist-col{grid-column:1}
  #rundetail{grid-column:2}
  .runs-wrap.collapsed{grid-template-columns:0fr 1fr}
  .runs-wrap.collapsed .runlist-col{display:none}
  /* Single column here, so the column-2 pin above would push #rundetail into an
     implicit second column instead of stacking it -- back to auto. */
  @media (max-width:900px){.runs-wrap{grid-template-columns:1fr} #rundetail{grid-column:auto}}

  /* ---- popout: a second tab showing only one run's work graph, opened from the
     graph panel's own pop-out button. Same page, same poll/render pipeline -- just
     the chrome around it hidden, so there is no second HTML file to keep in sync. */
  html.popout header{display:none}
  html.popout .runs-wrap{grid-template-columns:1fr}
  html.popout #rundetail{grid-column:auto}
  html.popout .runs-wrap .runlist-col{display:none}

  .runlist{display:flex;flex-direction:column;gap:8px}
  .runcard{
    text-align:left;width:100%;padding:12px 14px;border-radius:10px;
    background-color:var(--panel);
    box-shadow:inset 0 0 0 1px var(--line);display:block;transition:box-shadow .15s,background-color .15s;
  }
  .runcard:hover{background-color:#171717;box-shadow:inset 0 0 0 1px rgba(174,174,174,.4)}
  .runcard[aria-selected=true]{box-shadow:inset 0 0 0 1px var(--accent),0 0 16px rgba(174,174,174,.25)}
  .runcard .id{font-family:var(--mono);font-size:12px;color:var(--fg);word-break:break-all}
  .runcard .meta{margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  .pill{
    display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
    font-size:11px;font-family:var(--mono);text-transform:lowercase;letter-spacing:.02em;
    box-shadow:inset 0 0 0 1px currentColor;
  }
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
  .p-ok{color:var(--ok);background:rgba(57,255,157,.09)}
  .p-warn{color:var(--warn);background:rgba(255,176,32,.09)}
  .p-bad{color:var(--bad);background:rgba(255,61,127,.1)}
  .p-idle{color:var(--dim);background:rgba(74,65,115,.15);box-shadow:none}
  .p-accent{color:var(--accent2);background:rgba(34,226,255,.09)}
  .pill.plain::before{display:none}

  .panel{
    background:var(--panel);
    border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);padding:18px 20px;margin-bottom:18px;
  }
  .panel h2{margin:0 0 4px;font-size:15px;font-weight:600;font-family:var(--mono);letter-spacing:.01em}
  .panel h3{margin:20px 0 8px;font-size:11.5px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono)}
  .panel h3::before{content:"// "; color:var(--dim)}
  .panel h3:first-child{margin-top:0}

  .panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 4px;cursor:pointer;user-select:none}
  .panelhead h2{margin:0}
  .panelhead .chev{color:var(--dim);font-size:11px;font-family:var(--mono);flex-shrink:0}
  .panelhead:hover .chev{color:var(--muted)}
  .panelhead:focus-visible{outline:1px solid var(--accent);outline-offset:3px;border-radius:4px}
  .goal{color:var(--muted);margin:6px 0 0;max-width:74ch}

  /* ---- graph canvas ---- */
  .canvas{position:relative;padding:8px 4px 4px}
  .canvas svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .row{display:flex;justify-content:center;gap:26px;position:relative;z-index:2}
  .rowgap{height:34px}
  .lane{display:flex;flex-direction:column;align-items:center;gap:0}

  .node{
    position:relative;min-width:132px;max-width:190px;padding:9px 13px;border-radius:9px;
    background:var(--panel2);box-shadow:inset 0 0 0 1px #555555;text-align:center;
    transition:box-shadow .15s,background .15s;
  }
  .node:hover{background:#171717;box-shadow:inset 0 0 0 1px rgba(174,174,174,.45)}
  .node[aria-selected=true]{box-shadow:inset 0 0 0 1px var(--accent2),0 0 0 3px rgba(34,226,255,.15),0 0 20px rgba(34,226,255,.3)}
  .node .nname{font-family:var(--mono);font-size:12.5px}
  .node .nsub{font-size:10.5px;color:var(--dim);margin-top:3px;font-family:var(--mono)}
  .node .dot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;box-shadow:0 0 7px 1px currentColor}
  .node.gate{background:#1f0f10;box-shadow:inset 0 0 0 1px #5c2a3a}
  .node.gate .nname{color:var(--warn);text-shadow:0 0 8px rgba(255,176,32,.5)}
  .node.off{opacity:.4}
  .d-ok{background:var(--ok);color:var(--ok)} .d-warn{background:var(--warn);color:var(--warn)}
  .d-bad{background:var(--bad);color:var(--bad)} .d-idle{background:var(--idle);color:transparent;box-shadow:none}

  /* "live" = the stage run.status says is doing agent work right now (see the comment
     on buildNodes' liveFor). A breathing amber glow, same hue as the "in flight" dot
     legend already uses -- this doesn't introduce a new color, just motion for one that
     was previously flat. */
  .node.live{animation:livepulse 1.8s ease-in-out infinite}
  /* A live builder/reviewer's own tone is "idle" (unwritten yet), so its dot is
     `d-idle` -- transparent by design (see the rule above). Pulse the dot itself,
     not a `d-warn` variant that a live node practically never actually carries. */
  .node.live .dot{animation:livedot 1.8s ease-in-out infinite;background:var(--warn);
                  color:var(--warn);box-shadow:0 0 7px 1px var(--warn)}
  @keyframes livepulse{
    0%,100%{box-shadow:inset 0 0 0 1px var(--warn), 0 0 10px rgba(255,176,32,.25)}
    50%{box-shadow:inset 0 0 0 1px var(--warn), 0 0 22px rgba(255,176,32,.6)}
  }
  @keyframes livedot{0%,100%{opacity:.55} 50%{opacity:1}}
  .edge-flow{animation:edgeflow 900ms linear infinite}
  @keyframes edgeflow{to{stroke-dashoffset:-16}}
  /* One-shot packet: <animateMotion> (set in JS, walking the same `d` the edge itself
     was drawn with) owns POSITION; this owns visibility, fading the dot out over its
     own travel time rather than snapping it away, so it reads as arriving somewhere
     instead of vanishing mid-flight. Never looping -- see draw()'s packet() comment
     for the one-shot-per-edge-per-render-pass guarantee behind it. */
  .edge-packet{animation:packetfade 700ms ease-in forwards}
  @keyframes packetfade{0%,70%{opacity:1} 100%{opacity:0}}

  /* Stingers: a ONE-SHOT burst the instant a node's tone first resolves to ok/bad (see
     buildNodes' lastVerdict comment) -- never looping, never re-armed by a later render
     that reads the same settled verdict. PASS gets a bright green burst; REJECT gets a
     shake, the one place motion itself (not color) carries the "something went wrong"
     read, since d-bad already exists elsewhere and a shake is what makes THIS moment
     the one that just happened. */
  .node.stinger-pass{animation:stingerpass 900ms ease-out}
  .node.stinger-reject{animation:stingerreject 500ms ease-in-out}
  @keyframes stingerpass{
    0%{box-shadow:inset 0 0 0 1px var(--ok), 0 0 0 rgba(57,255,157,0)}
    30%{box-shadow:inset 0 0 0 2px var(--ok), 0 0 28px rgba(57,255,157,.85)}
    100%{box-shadow:inset 0 0 0 1px var(--line), 0 0 0 rgba(57,255,157,0)}
  }
  @keyframes stingerreject{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)} 40%{transform:translateX(5px)}
    60%{transform:translateX(-3px)} 80%{transform:translateX(2px)}
  }
  .stingerlabel{
    position:absolute;top:-11px;left:50%;transform:translate(-50%,4px) scale(.8);
    font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 8px;
    border-radius:999px;white-space:nowrap;pointer-events:none;opacity:0;
    animation:stingerlabel 1400ms ease-out forwards;
  }
  .stingerlabel.spass{background:rgba(57,255,157,.15);color:var(--ok);box-shadow:0 0 10px rgba(57,255,157,.5)}
  .stingerlabel.sreject{background:rgba(255,61,127,.15);color:var(--bad);box-shadow:0 0 10px rgba(255,61,127,.5)}
  @keyframes stingerlabel{
    0%{opacity:0;transform:translate(-50%,4px) scale(.8)}
    15%{opacity:1;transform:translate(-50%,0) scale(1.05)}
    25%{opacity:1;transform:translate(-50%,0) scale(1)}
    80%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-6px) scale(.95)}

     -- see lastToolCount. Text-only (color+scale), no box-shadow -- the row is a dense
     grid, not a graph node, and a glow there would compete with neighbouring rows. */
  .toolflash{animation:toolflash 700ms ease-out}

    0%{color:var(--accent2);text-shadow:0 0 8px rgba(34,226,255,.8);transform:scale(1.18)}
    100%{color:var(--dim);text-shadow:none;transform:scale(1)}
  }
  @media (prefers-reduced-motion:reduce){

  /* provenance mark under a node. Muted by default on purpose: an unstamped or
     never-run key is the common case on this fleet, and only a stamp naming the wrong

  .node .nprov{margin-top:4px;font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.01em}

     viewports rather than squeezing both into half-width columns. */
  .graphflow{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}

  .captionrow .captool{margin-top:2px;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.02em}

  .captionrow .captext.thinking{margin-top:6px;display:flex;gap:4px;align-items:center;font-style:normal}

  .captionrow .captext.thinking span:nth-child(2){animation-delay:.15s}

  .timeline{display:flex;flex-direction:column;gap:7px}
  .tlrow{display:flex;align-items:center;gap:10px}

  .fleetnode{box-shadow:inset 0 0 0 1px var(--accent2),0 0 16px rgba(34,226,255,.2)}

    width:100%;padding:8px 11px;margin-bottom:10px;border-radius:8px;background:var(--panel2);
    box-shadow:inset 0 0 0 1px var(--line);color:var(--fg);font-family:var(--mono);font-size:12px;

  .livedot{width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 8px 2px var(--accent2);animation:livepulse 1.4s ease-in-out infinite;flex:none}
  @keyframes livepulse{0%,100%{opacity:1}50%{opacity:.3}}
  /* A run waiting at the human gate is active-by-status but not actually doing
     anything -- a pulsing dot there would claim motion this data cannot back (the

  .livedot.waiting{background:var(--warn);box-shadow:0 0 6px 1px var(--warn);animation:none}
  .fleetselect{
    background:var(--panel2);color:var(--fg);font-family:var(--mono);font-size:11.5px;
    padding:5px 8px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--line);
    text-transform:uppercase;letter-spacing:.02em;max-width:200px;

  .diffgrid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:14px;overflow-x:auto;margin-top:12px;padding-bottom:4px}

     while you are looking at Portfolio or Roster, and a banner buried in #rundetail
     would never be seen. -->

      <div class="runlist" id="runlist"></div>

<script>
(function(){
"use strict";

var DATA = null;
var FLEETS = [];
var ACTIVE_FLEET = null;
var selectedRun = null;
var selectedNode = null;
var anon = false;
try { anon = localStorage.getItem("fleetview.anon") === "1"; } catch (e) {}
var runFilter = "";
var autoRefreshTimer = null;
var lastFingerprint = null;
/* One ETag per EXACT request URL, never one for the page. The list URL and a run's
   detail URL are different bodies with different tokens, and a single variable would
   let whichever answered last be sent back on the other -- a false 304, which is a
   live view frozen forever. The key already carries the fleet, the mode and the run
   id, so no two bodies can collide on it.
   THE INVARIANT: a token is stored with the body it describes and discarded in the
   same statement as that body. Keeping one past its body turns the next 304 into a
   blank pane no error path covers. */
var etags = {};
var runCache = {};                          // run_id -> {run, sig, url}: one run's depth, its signature, its ETag key
var detailError = {};                       // run_id -> a stated message, rendered INSIDE the detail pane
var pendingDetail = {};                     // run_id -> true while its one detail request is in flight
var cacheGen = 0;                           // bumped on every cache drop; a response from an older generation is dropped
var NOT_MODIFIED = {};                      // sentinel for "the server answered 304, there is no body"
var suppressHashPush = false;
var ACTIVE_STATUSES = ["scouting", "planning", "awaiting-approval", "building", "reviewing", "integrating"];
var VIEWS = ["runs", "portfolio", "roster"];
var currentView = "runs";
var IS_POPOUT = /(?:^|[?&])popout=1(?:&|$)/.test(location.search);

/* ---------- tiny helpers ---------- */

function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs){
    if (k === "class") n.className = attrs[k];
    /* Every visible string goes through scrub() here rather than at each call site --
       Anonymize has to hold everywhere, and "remember to anonymize this one too" is
       exactly the rule that failed for run ids and goals. */
    else if (k === "text") n.textContent = scrub(attrs[k]);
    else if (k === "html") n.innerHTML = attrs[k];
    else if (attrs[k] !== null && attrs[k] !== undefined){
      /* title is shown to a human; data-* and the rest are looked up by code and must
         keep their real values. */
      n.setAttribute(k, k === "title" ? scrub(attrs[k]) : attrs[k]);
    }
  }
  (kids || []).forEach(function(c){ if (c) n.appendChild(c); });
  return n;
}
function isEmpty(v){
  if (v === null || v === undefined || v === "") return true;
  if (Array.isArray(v)) return v.length === 0;
  if (typeof v === "object") return Object.keys(v).length === 0;
  return false;
}
function txt(v){
  if (v === null || v === undefined) return "";
  if (typeof v === "string") return v;
  return JSON.stringify(v, null, 2);
