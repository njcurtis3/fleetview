  // the browser already exited when the old one left the DOM. Sync the label to match.
  syncGraphFsBtn();

  if (selectedNode){
    var ins = inspect(run, selectedNode);
    if (ins) host.appendChild(ins);
  }

  var timeline = renderTimeline(run);
  if (timeline) host.appendChild(timeline);

  if (activity) host.appendChild(activity);

  host.appendChild(collapsiblePanel(run, "log", "log", [

          return el("li", {}, m ? [el("span", {class:"who", text:m[1]}), el("span", {text:" " + m[2]})]
                                : [el("span", {text:line})]);

/* ---------- rendering: node activity ---------- */

// `state.json` records what each node CONCLUDED. The activity lane records what the
// nodes DID, minute by minute, and it is the only view here that can show a run while
// it is still moving. Optional by design: a fleet that writes no activity.jsonl, or a
// run older than the heartbeat, renders no lane at all rather than an empty one.

function clockOf(t){
  if (typeof t !== "number") return "";
  var d = new Date(t * 1000);
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}

function spanText(row){
  if (typeof row.first !== "number" || typeof row.last !== "number") return "";
  var secs = Math.max(0, Math.round(row.last - row.first));
  return secs < 60 ? secs + "s" : Math.floor(secs / 60) + "m" + (secs % 60) + "s";
}

/* ---------- rendering: the run timeline ----------
   One horizontal lane per real subagent INSTANCE, positioned on a shared wall-clock
   axis by its own first/last event -- the swim-lane view of a run, distinct from the
   activity lane below it (per-TYPE totals plus a recent-event feed). This is the one
   place a diamond's actual concurrency -- two builders genuinely overlapping in real
   time, not just both listed as "building" -- is something you SEE rather than infer.
   Needs `instances[].first/last/tools`, which collect_activity (serve.py) tracks per
   instance the same way it already tracked them per type; an older server or an older
   run's heartbeat simply has none of that on any instance, and this renders nothing
   rather than a chart built on a made-up time axis -- see timelineSpan(). */

var TIMELINE_MIN_PCT = 2;   // a bar this narrow is unreadable otherwise; floor it, never hide it

/* The shared axis every lane is measured against: earliest instance start to latest
   instance end, where "end" is `now` for any instance still open and `last` for one
   that has closed. null means there is nothing with a real span to plot at all --
   no instance carries a numeric `first`, which is exactly what an old server or a
   pre-timeline run's heartbeat looks like. */
function timelineSpan(run){
  var instances = (run._activity && run._activity.instances) || [];
  var min = null, max = null, anyOpen = false;
  instances.forEach(function(inst){
    if (typeof inst.first !== "number") return;
    min = (min === null) ? inst.first : Math.min(min, inst.first);
    var end = inst.open ? Date.now() / 1000 : inst.last;
    if (typeof end === "number") max = (max === null) ? end : Math.max(max, end);
    if (inst.open) anyOpen = true;
  });
  if (min === null || max === null || max <= min) return null;
  return {min:min, max:max, anyOpen:anyOpen};
}

function renderTimeline(run){
  var act = run._activity;
  if (!act || !act.instances || !act.instances.length) return null;
  var span = timelineSpan(run);
  if (!span) return null;

  // Oldest start first, so the lanes read top-to-bottom the way the work actually
  // unfolded -- grouping by type instead would hide WHEN each instance really ran,
  // which is the one thing this view exists to show.
  var rows = act.instances
    .filter(function(inst){ return typeof inst.first === "number"; })
    .sort(function(a, b){ return a.first - b.first; })
    .map(function(inst){
      var end = inst.open ? Date.now() / 1000 : inst.last;
      var left = ((inst.first - span.min) / (span.max - span.min)) * 100;
      var width = Math.max(TIMELINE_MIN_PCT, ((end - inst.first) / (span.max - span.min)) * 100);
      var label = instanceLabel(run, inst);
      var dur = spanText({first:inst.first, last:end});
      var title = label + " — " + (inst.open ? "running " + dur + " so far" : "ran " + dur) +
                  (inst.tools ? ", " + inst.tools + " tool" + (inst.tools === 1 ? "" : "s") : "");
      return el("div", {class:"tlrow"}, [
        el("div", {class:"tlwho", text:label, title:label}),
        el("div", {class:"tltrack"}, [
          el("div", {class:"tlbar" + (inst.open ? " live" : ""),
                     style:"left:" + left.toFixed(2) + "%;width:" + width.toFixed(2) + "%",
                     title:title})
        ])
      ]);
    });
  // rows is never empty here: timelineSpan()'s min/max are computed over the exact
  // same `typeof inst.first === "number"` filter this map runs, so a non-null span
  // already proves at least one instance passed it.

  return collapsiblePanel(run, "timeline", "timeline", [
    el("p", {class:"goal", style:"margin-bottom:10px",
             text:"When each of this run's own agent instances actually ran, in real time -- " +
                  "spans " + spanText({first:span.min, last:span.max}) +
                  (span.anyOpen ? ", and still going." : ".")}),
    el("div", {class:"timeline"}, rows)
  ]);
}

function renderActivity(run){
  var act = run._activity;
  if (!act) return null;

  if (act.error){
    return el("div", {class:"panel"}, [
      el("h2", {text:"activity"}),
      el("div", {class:"banner", text:"activity.jsonl " + act.error})
    ]);
  }

  var agents = act.agents || [];
  var tail = act.tail || [];

  // A one-shot flash the instant an agent-type's tool count INCREASES since this viewer
  // last saw it -- never on first sight (an already-busy run would flash every row the
  // moment someone opened it), and self-cleans per row.agent so a closed run's rows
  // stop tracking once tools can no longer change. Keyed by run only, matching
  // `collect_activity`'s own grouping (one row per agent TYPE, not per lane/agent_id) --
  // see serve.py: a diamond's three builders already collapse into one "builder" row
  // there, so this flashes for the type as a whole, same granularity the row itself has.
  var rows = agents.map(function(row){
    var key = nodeKey(run, "activity:" + row.agent);
    var flash = lastToolCount[key] !== undefined && row.tools > lastToolCount[key];
    lastToolCount[key] = row.tools;
    return el("div", {class:"actrow"}, [
      el("span", {class:"who", text:row.agent}),
      row.open ? pill("running", "p-accent") : null,
      el("span", {class:"mono dim" + (flash ? " toolflash" : ""),
                  text:row.tools + " tool" + (row.tools === 1 ? "" : "s")}),
      row.spawns > 1 ? el("span", {class:"mono dim", text:row.spawns + " spawns"}) : null,
      el("span", {class:"mono dim", text:spanText(row)})
    ]);
  });

  var lines = tail.slice().reverse().map(function(e){
    var what = e.ev === "tool" ? (e.tool || "tool")
             : e.ev === "start" ? "spawned"
             : e.ev === "stop"  ? "finished" : (e.ev || "?");
    return el("li", {}, [
      el("span", {class:"mono dim", text:clockOf(e.t) + " "}),
      el("span", {class:"who", text:e.agent || "?"}),
      el("span", {text:" " + what})
    ]);
  });

  return collapsiblePanel(run, "activity", "activity", [
    el("p", {class:"goal", style:"margin-bottom:10px",
             text:"What the nodes did, from the fleet's own heartbeat — " +
                  act.total + " event" + (act.total === 1 ? "" : "s") +
                  (act.skipped ? ", " + act.skipped + " unreadable" : "") + "."}),
    agents.length ? el("div", {class:"actgrid"}, rows)
                  : el("p", {class:"empty", text:"no node events yet"}),
    lines.length ? el("ul", {class:"log", style:"margin-top:12px"}, lines) : null
  ]);
}

/* ---------- URL router (deep links to a run/node/tab) ----------
   The fragment looks like #runs?fleet=<id>&run=<id>&node=<id>, or just
   #portfolio / #roster. fleet is included only when more than one fleet is
   registered, so a single-fleet setup gets plain short links. */

function parseHash(){
  var h = location.hash.slice(1);
  var qIdx = h.indexOf("?");
  var view = (qIdx === -1 ? h : h.slice(0, qIdx)) || "runs";
  if (VIEWS.indexOf(view) === -1) view = "runs";
  var q = {};
  (qIdx === -1 ? "" : h.slice(qIdx + 1)).split("&").forEach(function(kv){
    if (!kv) return;
    var eq = kv.indexOf("=");
    var k = eq === -1 ? kv : kv.slice(0, eq);
    var v = eq === -1 ? "" : kv.slice(eq + 1);
    try { q[decodeURIComponent(k)] = decodeURIComponent(v); } catch (e) {}
  });
  return {view: view, fleet: q.fleet || null, run: q.run || null, node: q.node || null};
}

function buildHash(state){
  var q = [];
  if (state.fleet) q.push("fleet=" + encodeURIComponent(state.fleet));
  if (state.view === "runs"){
    if (state.run) q.push("run=" + encodeURIComponent(state.run));
    if (state.node) q.push("node=" + encodeURIComponent(state.node));
  }
  return "#" + state.view + (q.length ? "?" + q.join("&") : "");
}

function activateView(view, opts){
  opts = opts || {};
  if (VIEWS.indexOf(view) === -1) view = "runs";
  currentView = view;
  [].forEach.call(document.querySelectorAll(".tab"), function(t){
    t.setAttribute("aria-selected", String(t.dataset.view === view));
  });
  [].forEach.call(document.querySelectorAll("main"), function(m){ m.classList.remove("active"); });
  var host = document.getElementById("view-" + view);
  if (host) host.classList.add("active");
  var toggleRunsBtn = document.getElementById("toggleruns");
  if (toggleRunsBtn) toggleRunsBtn.style.display = view === "runs" ? "" : "none";
  if (view === "runs" && !opts.skipRerender) renderRunDetail();   // remeasure SVG edges once visible
}

function currentHashState(){
  return {
    view: currentView,
    fleet: FLEETS.length > 1 ? ACTIVE_FLEET : null,
    run: selectedRun,
    node: selectedNode
  };
}
function pushHash(){
  if (suppressHashPush) return;
  var h = buildHash(currentHashState());
  if (h !== location.hash) history.pushState(null, "", h);
}
function replaceHash(){
  if (suppressHashPush) return;
  var h = buildHash(currentHashState());
  if (h !== location.hash) history.replaceState(null, "", h);
}

window.addEventListener("popstate", function(){
  var st = parseHash();
  if (FLEETS.length > 1 && (st.fleet || FLEETS[0].id) !== ACTIVE_FLEET){
    load({fleet: st.fleet || FLEETS[0].id, applyFromHash: st});
    return;
  }
  suppressHashPush = true;
  selectedRun = st.run || null;
  selectedNode = st.node || null;
  renderRunList(); renderRunDetail(); renderPortfolio(); renderRoster();
  activateView(st.view, {skipRerender:true});
  suppressHashPush = false;
  /* Same code path a click takes, so there is one way to load depth rather than two:
     nothing is sent when the run stepped back to is still cached, and one request is
     when it is not. */
  ensureRunDetail(selectedRun);
});

/* ---------- the run detail cache, and the one request that fills it ----------
   `/api/graph?runs=light` ships every run as a flat row and nothing else; a run's
   heavy keys arrive from `/api/graph?run=<id>`, for the SELECTED run only. What that
   trade must not cost is stated in CLAUDE.md and enforced here: selection stays
   instant (the header paints from the row, synchronously, before anything is asked
   for), a re-selected unchanged run sends nothing at all, and a detail request can
   reach neither the auto-refresh timer nor the connection banner. */

function apiUrl(fleetParam, extra){
  var q = [];
  if (fleetParam) q.push("fleet=" + encodeURIComponent(fleetParam));
  if (extra) q.push(extra);
  return "/api/graph" + (q.length ? "?" + q.join("&") : "");
}

/* A server that answers with no `runs_mode` does not split, so its runs[] is already
   whole and nothing here ever fires. That absence IS the negotiation, in both
   directions — there is no version to check. */
function serverSplits(){ return !!(DATA && DATA.runs_mode === "light"); }

function rowFor(runId){
  var runs = (DATA && DATA.runs) || [];
  for (var i = 0; i < runs.length; i++) if (runs[i].run_id === runId) return runs[i];
  return null;
}

/* Everything about a run that can move without the run itself being refetched.
   `_mtime` catches a node writing state.json; `_activity_n` catches the heartbeat
   appending. The count is not redundant: two events landing inside the same float
   tick leave `_activity_last` unchanged while the tail moves, and a cache invalidated
   on the timestamp alone would then show a live run's activity lane frozen for good. */
function rowSig(row){
  if (!row) return null;
  return [row._mtime, row._activity_last, row._activity_n].join("|");
}

/* The depth for a list row: the row itself when the server sent whole runs, else
   whatever this run's own request cached. Null means "not here yet", which is a
   render state, not an error. */
function runDetail(row){
  if (!row) return null;
  if (!row._light) return row;
  var entry = runCache[row.run_id];
  return entry ? entry.run : null;
}

/* A body and the ETag describing it are discarded in ONE statement, always. */
function dropRunDetail(runId){
  var entry = runCache[runId];
  if (entry) delete etags[entry.url];
  delete runCache[runId];
}
function dropAllRunDetail(){
  runCache = {}; etags = {}; detailError = {}; pendingDetail = {};
  cacheGen++;
}

/* Applied to every list response, before anything renders from it. A cached run whose
   row moved, or whose row is gone from the list entirely, is dropped here — so a run
   selected later refetches instead of rendering what it looked like an hour ago. */
function reconcileRunCache(){
  Object.keys(runCache).forEach(function(id){
    var row = rowFor(id);
    if (!row || rowSig(row) !== runCache[id].sig) dropRunDetail(id);
  });
}

function detailPendingPanel(runId){
  var err = detailError[runId];
  return el("div", {class:"panel"}, [
    el("h2", {text:"work graph"}),
    err ? el("div", {class:"banner", style:"margin-top:10px", text:err})
        : el("p", {class:"empty", style:"margin-top:10px", text:"loading run detail…"})
  ]);
}

/* At most one request, for that run alone, and only when it must. Called by the click
   handler, by the router and from the tail of a list response — never from inside
   renderRunDetail(), which stays pure so it can always be called again for free. */
function ensureRunDetail(runId){
  if (!runId || !serverSplits()) return;
  var row = rowFor(runId);
  if (!row || !row._light || row._error) return;            // nothing to fetch, or nothing to fetch it for
  if (runCache[runId] && runCache[runId].sig === rowSig(row)) return;   // cached and it has not moved
  if (pendingDetail[runId]) return;                         // its one request is already out
  fetchRunDetail(runId, rowSig(row));
}

/* THE CHAIN THAT CANNOT REACH THE POLL. Nothing below calls scheduleAutoRefresh(),
   showConnError() or clearConnError() — load() owns the timer and the banner, and a
   poll that dies while the livedot stays lit is the bug this app has already had
   twice. A failure here renders inside the detail pane and nowhere else; the next
   poll, which load() has already scheduled, retries it. */
function fetchRunDetail(runId, sig){
  var fleetAtRequest = ACTIVE_FLEET;
  var genAtRequest = cacheGen;
  var url = apiUrl(fleetAtRequest, "run=" + encodeURIComponent(runId));
  var headers = etags[url] ? {"If-None-Match": etags[url]} : {};
  pendingDetail[runId] = true;

  /* A response is applied only if it is still the answer to the question on screen:
     the same fleet, the same selected run, and the same cache generation. Click A
     then B before A lands and A's slow response would otherwise paint over B — the
     same class of bug as a false 304. */
  function stale(){
    return cacheGen !== genAtRequest || ACTIVE_FLEET !== fleetAtRequest || selectedRun !== runId;
  }

  return fetch(url, {cache:"no-store", headers: headers})
    .then(function(r){
      var token = (r.headers && r.headers.get) ? r.headers.get("ETag") : null;
      if (r.status === 304) return {kind:"same"};
      if (r.status === 404) return {kind:"gone"};
      if (r.status >= 400) throw new Error("HTTP " + r.status);
      return r.json().then(function(d){ return {kind:"body", body:d, etag:token}; });
    })
    .then(function(res){
      delete pendingDetail[runId];
      if (stale()) return;

      if (res.kind === "gone"){
        dropRunDetail(runId);
        detailError[runId] = "This run is no longer in the fleet — /api/graph answered 404 for " +
          runId + ". It may have been archived or deleted since the run list was read.";
        renderRunDetail();
        return;
      }
      if (res.kind === "same"){
        /* The body we still hold is current; only its signature moved on. */
        if (runCache[runId]) runCache[runId].sig = sig;
        delete detailError[runId];
        renderRunDetail();
        return;
      }

      var d = res.body;
      /* An old server ignores `?run=` and answers with the whole payload. Absence
         degrades to the old path rather than crashing: take the run out of runs[]. */
      var run = (d && d.run) ? d.run
              : ((d && d.runs) || []).filter(function(r){ return r.run_id === runId; })[0];
      if (!run){
        detailError[runId] = "The server answered /api/graph?run=" + runId +
          " without that run in it, so there is no detail to show.";
        dropRunDetail(runId);
        renderRunDetail();
        return;
      }
      dropRunDetail(runId);
      runCache[runId] = {run: run, sig: sig, url: url};
      if (res.etag) etags[url] = res.etag;          // stored WITH the body it describes
      delete detailError[runId];
      renderRunDetail();
    })
    .catch(function(e){
      delete pendingDetail[runId];
      if (stale()) return;
      dropRunDetail(runId);
      detailError[runId] = "Could not load this run's detail (" + e + "). The run list is still " +
        "current; the next refresh will try again.";
      renderRunDetail();
    });
}

/* ---------- auto-refresh while a run is in flight ---------- */

function anyRunActive(){
  return ((DATA && DATA.runs) || []).some(function(r){ return ACTIVE_STATUSES.indexOf(r.status) !== -1; });
}

/* `retry` keeps the poll alive after a failed fetch. Without it one blip killed
   auto-refresh permanently — the timer was only ever rescheduled on success, while the
   livedot from the previous cycle stayed lit, so the page looked live and was frozen. */
function scheduleAutoRefresh(retry){
  if (autoRefreshTimer){ clearTimeout(autoRefreshTimer); autoRefreshTimer = null; }
  var live = anyRunActive();
  document.getElementById("livedot").style.display = live ? "" : "none";
  if (live || retry) autoRefreshTimer = setTimeout(function(){ load({fleet: ACTIVE_FLEET, silent:true}); }, 4000);
}

/* Everything a render depends on, minus `generated` — which is stamped per request and
   so is never equal between two polls. Lets a silent refresh skip the re-render when
   nothing on disk actually moved, which is the common case while a node is thinking. */
function payloadFingerprint(d){
  if (!d) return "";
  return JSON.stringify([d.active_fleet_id, d.fleet, d.fleets, d.portfolio, d.agents, d.skills,
                         d.runs_mode, d.runs]);
}

function showConnError(err){
  var b = document.getElementById("connbanner");
  b.textContent = scrub("Could not reach /api/graph — is serve.py still running? (" + err + ") Retrying every 4s.");
  b.style.display = "";
}
function clearConnError(){
  document.getElementById("connbanner").style.display = "none";
}
function renderStamp(){
  document.getElementById("stamp").textContent =
    DATA && DATA.generated ? "read " + new Date(DATA.generated).toLocaleTimeString() : "";
}

/* ---------- tab chrome: title + favicon ----------
   The caption pane only helps while this tab is focused -- this is the same "stop
   flipping back to the terminal to see what's happening" idea for when it is not.
   Both are recomputed from exactly what the run list already reads (runActivityKind,
   activityAgeSecs, wedgedFor), so this can never claim something the page itself
   isn't already showing, and needs no field or fetch beyond what feeds a run row. */

var FAVICON_CACHE = {};
/* A plain inline SVG data URI, not a <canvas>, on purpose: it is a pure string
   builder with nothing to draw, so it needs no document at all and runs the same
   under Node's test harness as in a real tab -- the DOM shim has no getContext. */
function faviconHref(kind){
  if (FAVICON_CACHE[kind]) return FAVICON_CACHE[kind];
  var color = {active:"#22e2ff", waiting:"#ffb020", wedged:"#ff3d7f"}[kind] || "#6f6f6f";
  // "waiting" draws as a ring, not a filled dot -- "paused", not "running" or
  // "broken" -- the same read the amber static run-list dot uses for the same state.
  var shape = (kind === "waiting")
    ? '<circle cx="8" cy="8" r="5" fill="none" stroke="' + color + '" stroke-width="3"/>'
    : '<circle cx="8" cy="8" r="6" fill="' + color + '"/>';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16">' + shape + '</svg>';
  return (FAVICON_CACHE[kind] = "data:image/svg+xml," + encodeURIComponent(svg));
}

function updateLiveChrome(){
  var runs = (DATA && DATA.runs) || [];
  var focusRow = selectedRun ? rowFor(selectedRun) : null;
  var focusKind = focusRow ? runActivityKind(focusRow) : "idle";

  // `label` is only ever the DYNAMIC half of the title -- a run's own status and
  // app id, or a fleet-wide count -- and null on the fully idle case. The literal
  // word "FleetView" never passes through it, because a real fleet very often
  // registers fleetview itself in the portfolio (it's a `kind: tool` node like any
  // other), and scrub() is a case-insensitive whole-token match: it would happily
  // rewrite the app's own brand name into "App N" the moment that happens, which is
  // not what Anonymize exists to redact. label IS scrubbed, same as every other
  // visible string -- see the note below.
  var kind, label;
  if (focusKind !== "idle"){
    // A run the reader has actually selected is what they are watching -- report
    // on THAT run specifically, never an aggregate they didn't ask about.
    kind = focusKind;
    var icon = {active:"●", waiting:"⏸", wedged:"⚠"}[kind];
    var status = kind === "wedged" ? "stalled " + relSpan(wedgedFor(focusRow)) : (focusRow.status || "working");
    label = icon + " " + status + " · " + (appLabel(focusRow.app) || focusRow.run_id);
  } else {
    // No selection, or the selected run isn't the one doing something: fall back to
    // the whole fleet, worst signal first -- a stalled run is worth noticing over a
    // healthy one, which is worth noticing over nothing happening at all.
    var counts = {wedged:0, active:0, waiting:0};
    runs.forEach(function(r){ var k = runActivityKind(r); if (counts[k] !== undefined) counts[k]++; });
    kind = counts.wedged ? "wedged" : counts.active ? "active" : counts.waiting ? "waiting" : "idle";
    if (kind !== "idle"){
      var icon2 = {active:"●", waiting:"⏸", wedged:"⚠"}[kind];
      var word = {active:"active", waiting:"waiting on you", wedged:"stalled"}[kind];
      label = icon2 + " " + counts[kind] + " " + word;
    }
  }
  // Every other visible string goes through el()'s scrub() call; document.title is
  // outside that one choke point (it isn't a DOM node el() ever touches), so it has
  // to be scrubbed explicitly here or Anonymize would leave a real run id sitting in
  // the tab strip and any screen-share history that captures it. Only `label` is
  // scrubbed, and only when there is one -- the static "FleetView" suffix is never
  // handed to scrub() at all, for the reason above.
  document.title = label ? scrub(label) + " — FleetView" : "FleetView";
  document.getElementById("favicon").href = faviconHref(kind);
}

/* ---------- fleet switcher ---------- */

function renderFleetSwitcher(){
  var sel = document.getElementById("fleetselect");
  var pathSpan = document.getElementById("fleetpath");
  if (FLEETS.length > 1){
    sel.style.display = "";
    pathSpan.style.display = "none";
    sel.innerHTML = "";
    FLEETS.forEach(function(f){
      var opt = document.createElement("option");
      opt.value = f.id;                                   // the real id: it is sent to the server
      opt.textContent = scrub(f.label) + (f.found ? "" : " (not found)");
      opt.title = scrub(f.path);
      if (f.id === ACTIVE_FLEET) opt.selected = true;
      sel.appendChild(opt);
    });
  } else {
    sel.style.display = "none";
    pathSpan.style.display = "";
  }
}

function renderAll(){
  anonMap = null; anonLower = null; anonRe = null;
  var f = (DATA && DATA.fleet) || {};
  document.getElementById("fleetpath").textContent = f.found ? scrub(f.path) : "no fleet";
  document.getElementById("fleetpath").style.color = f.found ? "" : "var(--warn)";
  renderStamp();
  renderFleetSwitcher();
  renderRunList(); renderRunDetail(); renderPortfolio(); renderRoster();
}

function load(opts){
  opts = opts || {};
  var fleetParam = "fleet" in opts ? opts.fleet : ACTIVE_FLEET;
  /* The list, always: the poll, the first load, Refresh and a fleet switch all ask for
     the same URL, and the depth is never fetched from here. An old server ignores
     `runs=light` and answers with the whole payload, which renders correct-but-large. */
  var url = apiUrl(fleetParam, "runs=light");

  /* Every non-silent load is an explicit "rebuild the page now" — Refresh, a fleet
     switch, a popstate that crossed fleets — and each drops the WHOLE cache with every
     ETag in it. A fleet switch has to: two fleets can hold the same run id, so a cache
     that outlived the switch would render one fleet's run under another fleet's name.
     Refresh has to for a different reason: it already forces a 200 by sending no
     If-None-Match, and a cache that survived it would make the button a lie. */
  if (!opts.silent) dropAllRunDetail();

  var failed = false;

  /* Conditional request. With an ETag in hand a poll that finds nothing changed comes
     back as a bodiless 304 instead of re-shipping the whole snapshot — which also
     skips the JSON.parse and the fingerprint stringify below, the two costs an
     unchanged poll used to pay every 4s. `cache:"no-store"` stays: it keeps the
     browser cache out of it, while the revalidation is ours, sent by hand and read by
     hand, so the two do not fight. Optional in both directions — an old server sends
     no ETag, we store none, and every request is a plain 200.

     Only the SILENT poll asks conditionally. An explicit user action — Refresh, a
     fleet switch — always asks unconditionally and always gets a 200, so Refresh keeps
     meaning "rebuild the page now" instead of quietly returning on a 304. That is
     where the whole win lives anyway: the 4s poll is the request that repeats.

     The token is looked up by the EXACT url about to be requested, so the list's ETag
     and a run detail's can never be sent to each other's URL. */
  var headers = (opts.silent && etags[url]) ? {"If-None-Match": etags[url]} : {};

  return fetch(url, {cache:"no-store", headers: headers})
    .then(function(r){
      if (r.status === 304) return NOT_MODIFIED;
      var token = (r.headers && r.headers.get) ? r.headers.get("ETag") : null;
      return r.json().then(function(d){
        /* Keyed by the URL that NAMES this body, which is the one every later poll
           asks with. The FIRST load asks without a fleet id because it does not know
           one yet and the server picks; keying that token by the literal first URL
           would leave it unreachable and make the first poll of every page load
           unconditional. Stored here, beside the body it describes, and never before
           the parse — a token kept for a body we failed to read is the blank pane. */
        var key = apiUrl((d && d.active_fleet_id) || fleetParam, "runs=light");
        if (token) etags[key] = token; else delete etags[key];
        return d;
      });
    })
    .then(function(d){
      clearConnError();

      /* 304 means the bytes behind DATA are still current, so DATA, FLEETS and
         ACTIVE_FLEET are left exactly as they are — replacing them here would empty
         the page every 4s. It ends at the same place as the fingerprint short-circuit
         below (stamp the clock, stop), and the tail still reschedules, so an unbroken
         run of 304s keeps the page live rather than killing the poll. The stamp moves
         because the server did re-read the disk to answer; it just found the same
         thing. */
      if (d === NOT_MODIFIED){
        if (DATA) DATA.generated = new Date().toISOString();
        renderStamp();
        return;
      }

      /* A silent poll that finds nothing changed updates the clock and stops there.
         A full re-render tears down the detail pane, and doing that every 4s under a
         reader is the thing that made a live run unwatchable. */
      var fp = payloadFingerprint(d);
      var unchanged = opts.silent && fp === lastFingerprint;
      lastFingerprint = fp;

      DATA = d;
      FLEETS = d.fleets || [];
      ACTIVE_FLEET = d.active_fleet_id || null;

      /* Before anything renders from the new list: drop the depth of any run whose row
         moved or vanished. This is what makes the selected active run's refetch happen
         at all, and what stops an unmoved one from happening. */
      reconcileRunCache();

      if (unchanged){ renderStamp(); return; }

      if (opts.applyFromHash){
        selectedRun = opts.applyFromHash.run || null;
        selectedNode = opts.applyFromHash.node || null;
      } else if (opts.resetSelection){
        selectedRun = null;
        selectedNode = null;
      }

      suppressHashPush = true;
      renderAll();
      if (opts.applyFromHash) activateView(opts.applyFromHash.view, {skipRerender:true});
      suppressHashPush = false;

      if (opts.resetSelection) pushHash();
    })
    .catch(function(e){
      failed = true;
      showConnError(e);
    })
    .then(function(){
      // Always, on both paths: a failed poll must still schedule the next one, or one
      // dropped request ends auto-refresh for the life of the page.
      scheduleAutoRefresh(failed);
    })
    .then(function(){
      /* The selected run's depth, and only if it is missing or its row moved — which
         on most polls it has not, so most polls send exactly one request in total.
         Issued from the list's completion handler, never concurrently with it, so a
         detail is always fetched against a signature the client has already seen. And
         issued AFTER the poll has rescheduled itself, so nothing on the detail chain
         can reach the timer, even by throwing. */
      if (!failed) ensureRunDetail(selectedRun);
    });
}

document.getElementById("tabs").addEventListener("click", function(ev){
  var b = ev.target.closest(".tab");
  if (!b) return;
  activateView(b.dataset.view);
  pushHash();
});

document.getElementById("refresh").addEventListener("click", function(){ load({fleet: ACTIVE_FLEET}); });

document.getElementById("fleetselect").addEventListener("change", function(ev){
  load({fleet: ev.target.value, resetSelection: true});
});

document.getElementById("runsearch").addEventListener("input", function(ev){
  runFilter = ev.target.value.trim().toLowerCase();
  renderRunList();
});

var anonBtn = document.getElementById("anon");
function syncAnonBtn(){ anonBtn.classList.toggle("on", anon); }
anonBtn.addEventListener("click", function(){
  anon = !anon;
  try { localStorage.setItem("fleetview.anon", anon ? "1" : "0"); } catch (e) {}
  syncAnonBtn(); renderAll();
});
syncAnonBtn();

var runsCollapsed = false;
try { runsCollapsed = localStorage.getItem("fleetview.runsCollapsed") === "1"; } catch (e) {}
var runswrapEl = document.getElementById("runswrap");
var toggleRunsBtn = document.getElementById("toggleruns");
function syncRunsCollapse(){
  runswrapEl.classList.toggle("collapsed", runsCollapsed);
  toggleRunsBtn.textContent = runsCollapsed ? "Show Runs" : "Hide Runs";
  toggleRunsBtn.title = runsCollapsed ? "Show the run list on the left" : "Hide the run list on the left";
}
toggleRunsBtn.addEventListener("click", function(){
  runsCollapsed = !runsCollapsed;
  try { localStorage.setItem("fleetview.runsCollapsed", runsCollapsed ? "1" : "0"); } catch (e) {}
  syncRunsCollapse();
});
syncRunsCollapse();

// One listener for the life of the page, not one per render: renderRunDetail rebuilds
// #graphpanel from scratch on every poll, so a listener attached per-build would pile
// up forever (the panel it closed over never gets removed from `document`'s list).
// This one re-reads the current button/panel by id instead, so it stays correct across
// every rebuild without ever being re-registered.
document.addEventListener("fullscreenchange", syncGraphFsBtn);

var initialHash = parseHash();
load({fleet: initialHash.fleet, applyFromHash: initialHash});
setInterval(tickLiveChips, 1000);
})();
</script>
</body>
