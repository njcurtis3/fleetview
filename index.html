<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetView</title>
<style>
  :root{
    --bg:#07040f; --panel:#130b26; --panel2:#0d0819; --line:#2c1f52;
    --fg:#eae4ff; --muted:#a496d6; --dim:#5d4f8f;
    --accent:#8a5cff; --accent2:#22e2ff; --ok:#39ff9d; --warn:#ffb020; --bad:#ff3d7f; --idle:#4a4173;
    --glow-a:0 0 10px rgba(138,92,255,.55), 0 0 26px rgba(138,92,255,.22);
    --glow-c:0 0 10px rgba(34,226,255,.5), 0 0 24px rgba(34,226,255,.2);
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,"Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;
    background:
      radial-gradient(ellipse 900px 500px at 8% -10%, rgba(138,92,255,.16), transparent 60%),
      radial-gradient(ellipse 900px 600px at 100% 0%, rgba(34,226,255,.10), transparent 55%),
      radial-gradient(ellipse 1200px 800px at 50% 120%, rgba(138,92,255,.08), transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;mix-blend-mode:overlay;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 3px);
    opacity:.5;
  }
  a{color:var(--accent2)}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  ::selection{background:rgba(138,92,255,.4);color:#fff}

  header{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:14px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(19,11,38,.92), rgba(13,8,25,.92));
    backdrop-filter:blur(6px);
    box-shadow:0 1px 0 rgba(138,92,255,.15), 0 4px 24px rgba(0,0,0,.4);
    position:sticky;top:0;z-index:20;
  }
  .brand{
    font-weight:700;letter-spacing:.04em;display:flex;align-items:baseline;gap:9px;
    font-family:var(--mono);text-transform:uppercase;font-size:14px;
    color:#f2eeff;text-shadow:0 0 8px rgba(138,92,255,.9), 0 0 22px rgba(138,92,255,.4);
  }
  .brand::before{content:"▸";color:var(--accent2);text-shadow:0 0 8px rgba(34,226,255,.9);margin-right:1px}
  .brand small{font-weight:400;color:var(--muted);font-size:11px;text-shadow:none;text-transform:none;letter-spacing:.02em}
  .tabs{display:flex;gap:2px;margin-left:8px}
  .tab{padding:6px 14px;border-radius:7px;color:var(--muted);font-size:12.5px;font-family:var(--mono);letter-spacing:.03em;text-transform:uppercase;transition:color .15s,box-shadow .15s}
  .tab:hover{color:var(--fg);background:rgba(138,92,255,.08)}
  .tab[aria-selected=true]{
    background:rgba(138,92,255,.12);color:#fff;
    box-shadow:inset 0 0 0 1px var(--accent), 0 0 12px rgba(138,92,255,.35);
    text-shadow:0 0 8px rgba(138,92,255,.6);
  }
  .spacer{flex:1}
  .ctl{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
  .ctl button{padding:6px 12px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font-size:11.5px;font-family:var(--mono);letter-spacing:.02em;text-transform:uppercase;transition:all .15s}
  .ctl button:hover{color:var(--fg);background:rgba(138,92,255,.1);box-shadow:inset 0 0 0 1px var(--accent)}
  .ctl button.on{color:var(--accent2);box-shadow:inset 0 0 0 1px var(--accent2),0 0 10px rgba(34,226,255,.35);text-shadow:0 0 6px rgba(34,226,255,.6)}

  main{display:none;padding:22px}
  main.active{display:block}

  /* ---- runs layout ---- */
  .runs-wrap{display:grid;grid-template-columns:minmax(230px,290px) 1fr;gap:22px;align-items:start}
  @media (max-width:900px){.runs-wrap{grid-template-columns:1fr}}

  .runlist{display:flex;flex-direction:column;gap:8px}
  .runcard{
    text-align:left;width:100%;padding:12px 14px;border-radius:10px;
    background:linear-gradient(180deg, rgba(138,92,255,.05), transparent);
    background-color:var(--panel);
    box-shadow:inset 0 0 0 1px var(--line);display:block;transition:box-shadow .15s,background-color .15s;
  }
  .runcard:hover{background-color:#1a1034;box-shadow:inset 0 0 0 1px rgba(138,92,255,.4)}
  .runcard[aria-selected=true]{box-shadow:inset 0 0 0 1px var(--accent),0 0 16px rgba(138,92,255,.25)}
  .runcard .id{font-family:var(--mono);font-size:12px;color:var(--fg);word-break:break-all}
  .runcard .meta{margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  .pill{
    display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
    font-size:11px;font-family:var(--mono);text-transform:lowercase;letter-spacing:.02em;
    box-shadow:inset 0 0 0 1px currentColor;
  }
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
  .p-ok{color:var(--ok);background:rgba(57,255,157,.09)}
  .p-warn{color:var(--warn);background:rgba(255,176,32,.09)}
  .p-bad{color:var(--bad);background:rgba(255,61,127,.1)}
  .p-idle{color:var(--dim);background:rgba(74,65,115,.15);box-shadow:none}
  .p-accent{color:var(--accent2);background:rgba(34,226,255,.09)}
  .pill.plain::before{display:none}

  .panel{
    background:linear-gradient(180deg, rgba(138,92,255,.035), transparent 40%), var(--panel);
    border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);padding:18px 20px;margin-bottom:18px;
  }
  .panel h2{margin:0 0 4px;font-size:15px;font-weight:600;font-family:var(--mono);letter-spacing:.01em}
  .panel h3{margin:20px 0 8px;font-size:11.5px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono)}
  .panel h3::before{content:"// "; color:var(--dim)}
  .panel h3:first-child{margin-top:0}
  .goal{color:var(--muted);margin:6px 0 0;max-width:74ch}

  /* ---- graph canvas ---- */
  .canvas{position:relative;padding:8px 4px 4px}
  .canvas svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .row{display:flex;justify-content:center;gap:26px;position:relative;z-index:2}
  .rowgap{height:34px}
  .lane{display:flex;flex-direction:column;align-items:center;gap:0}

  .node{
    position:relative;min-width:132px;max-width:190px;padding:9px 13px;border-radius:9px;
    background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);text-align:center;
    transition:box-shadow .15s,background .15s;
  }
  .node:hover{background:#191033;box-shadow:inset 0 0 0 1px rgba(138,92,255,.45)}
  .node[aria-selected=true]{box-shadow:inset 0 0 0 1px var(--accent2),0 0 0 3px rgba(34,226,255,.15),0 0 20px rgba(34,226,255,.3)}
  .node .nname{font-family:var(--mono);font-size:12.5px}
  .node .nsub{font-size:10.5px;color:var(--dim);margin-top:3px;font-family:var(--mono)}
  .node .dot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;box-shadow:0 0 7px 1px currentColor}
  .node.gate{background:#1f0f10;box-shadow:inset 0 0 0 1px #5c2a3a}
  .node.gate .nname{color:var(--warn);text-shadow:0 0 8px rgba(255,176,32,.5)}
  .node.off{opacity:.4}
  .d-ok{background:var(--ok);color:var(--ok)} .d-warn{background:var(--warn);color:var(--warn)}
  .d-bad{background:var(--bad);color:var(--bad)} .d-idle{background:var(--idle);color:transparent;box-shadow:none}

  /* "live" = the stage run.status says is doing agent work right now (see the comment
     on buildNodes' liveFor). A breathing amber glow, same hue as the "in flight" dot
     legend already uses -- this doesn't introduce a new color, just motion for one that
     was previously flat. */
  .node.live{animation:livepulse 1.8s ease-in-out infinite}
  /* A live builder/reviewer's own tone is "idle" (unwritten yet), so its dot is
     `d-idle` -- transparent by design (see the rule above). Pulse the dot itself,
     not a `d-warn` variant that a live node practically never actually carries. */
  .node.live .dot{animation:livedot 1.8s ease-in-out infinite;background:var(--warn);
                  color:var(--warn);box-shadow:0 0 7px 1px var(--warn)}
  @keyframes livepulse{
    0%,100%{box-shadow:inset 0 0 0 1px var(--warn), 0 0 10px rgba(255,176,32,.25)}
    50%{box-shadow:inset 0 0 0 1px var(--warn), 0 0 22px rgba(255,176,32,.6)}
  }
  @keyframes livedot{0%,100%{opacity:.55} 50%{opacity:1}}
  .edge-flow{animation:edgeflow 900ms linear infinite}
  @keyframes edgeflow{to{stroke-dashoffset:-16}}
  @media (prefers-reduced-motion:reduce){
    .node.live, .node.live .dot, .edge-flow{animation:none}
  }

  /* provenance mark under a node. Muted by default on purpose: an unstamped or
     never-run key is the common case on this fleet, and only a stamp naming the wrong
     node is allowed to shout. */
  .node .nprov{margin-top:4px;font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.01em}
  .node .nprov.bad{color:var(--bad);text-shadow:0 0 8px rgba(255,61,127,.45)}

  .scopepath{margin-top:6px;color:var(--fg);word-break:break-all}

  .slicehead{font-family:var(--mono);font-size:10.5px;color:var(--accent2);margin-bottom:6px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;font-family:var(--mono)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:7px;height:7px;border-radius:50%;display:inline-block;box-shadow:0 0 6px 1px currentColor}

  /* ---- inspector ---- */
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
  .kv dt{color:var(--dim);font-family:var(--mono);font-size:11.5px;padding-top:1px}
  .kv dd{margin:0}
  ul.list{margin:0;padding-left:18px}
  ul.list li{margin-bottom:7px;max-width:96ch}
  ul.list li::marker{color:var(--dim)}
  code,.mono{font-family:var(--mono);font-size:12px}
  code{background:rgba(138,92,255,.1);box-shadow:inset 0 0 0 1px rgba(138,92,255,.25);padding:1px 5px;border-radius:4px;color:#cbb8ff;word-break:break-word}
  .risk::marker{color:var(--bad)}
  .fact::marker{color:var(--ok)}
  .unknown::marker{color:var(--warn)}
  .empty{color:var(--dim);font-style:italic}

  .log{list-style:none;margin:0;padding:0}
  .log li{position:relative;padding:0 0 12px 20px;border-left:1px solid var(--line);margin-left:4px}
  .log li:last-child{border-left-color:transparent;padding-bottom:0}
  .log li::before{content:"";position:absolute;left:-4px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--idle)}
  .log li:last-child::before{background:var(--accent2);box-shadow:0 0 8px 1px var(--accent2)}
  .log .who{font-family:var(--mono);font-size:11.5px;color:var(--accent2);text-shadow:0 0 6px rgba(34,226,255,.4)}

  /* activity lane: one row per node, newest events beneath */
  .actgrid{display:flex;flex-direction:column;gap:6px}
  .actrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 11px;border-radius:8px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
  .actrow .who{font-family:var(--mono);font-size:12px;color:var(--accent2);min-width:86px}
  .dim{color:var(--dim);font-size:11px}

  .findings{margin:0;padding:0;list-style:none}
  .findings li{padding:9px 12px;border-radius:8px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:8px}
  .findings .loc{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .sev{float:right;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}

  /* ---- portfolio ---- */
  .umbrella-graph{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0 2px}
  .appgrid{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .appnode{min-width:170px;max-width:230px;padding:12px 14px;border-radius:10px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);text-align:left;transition:box-shadow .15s}
  .appnode:hover{box-shadow:inset 0 0 0 1px rgba(138,92,255,.4),0 0 14px rgba(138,92,255,.15)}
  .appnode .an{font-family:var(--mono);font-size:12.5px}
  .appnode .ao{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.45}
  .appnode .at{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-family:var(--mono);font-size:10px;color:var(--dim);padding:1px 6px;border-radius:4px;background:rgba(138,92,255,.08);box-shadow:inset 0 0 0 1px rgba(138,92,255,.15)}
  .fleetnode{box-shadow:inset 0 0 0 1px var(--accent2),0 0 16px rgba(34,226,255,.2)}
  .fleetnode .an{color:var(--accent2);text-shadow:0 0 8px rgba(34,226,255,.5)}
  .note{color:var(--muted);font-size:12.5px;max-width:80ch;overflow-wrap:break-word}
  .note-wrap{max-width:80ch}
  .note-toggle{display:block;margin:4px 0 8px;padding:2px 0;font-size:11px;color:var(--accent2);text-decoration:underline;text-underline-offset:2px}
  .note-toggle:hover{color:var(--accent)}

  /* ---- roster ---- */
  .roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
  .agentcard{padding:15px 17px;border-radius:11px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .15s}
  .agentcard:hover{box-shadow:inset 0 0 0 1px rgba(138,92,255,.4)}
  .agentcard .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .agentcard .an{font-family:var(--mono);font-size:13.5px}
  .agentcard p{color:var(--muted);font-size:12.5px;margin:9px 0 0}
  .agentcard .tools{margin-top:11px;display:flex;gap:5px;flex-wrap:wrap}
  .m-haiku{color:var(--ok);background:rgba(57,255,157,.1);box-shadow:inset 0 0 0 1px rgba(57,255,157,.25)}
  .m-opus{color:var(--accent2);background:rgba(34,226,255,.1);box-shadow:inset 0 0 0 1px rgba(34,226,255,.25)}

  .banner{padding:11px 15px;border-radius:9px;background:rgba(255,176,32,.07);box-shadow:inset 0 0 0 1px rgba(255,176,32,.3),0 0 14px rgba(255,176,32,.1);color:#ffcf80;font-size:12.5px;margin-bottom:18px;font-family:var(--mono)}
  .connbanner{margin:18px 22px 0}

  /* ---- run search ---- */
  .searchbox{
    width:100%;padding:8px 11px;margin-bottom:10px;border-radius:8px;background:var(--panel2);
    box-shadow:inset 0 0 0 1px var(--line);color:var(--fg);font-family:var(--mono);font-size:12px;
    transition:box-shadow .15s;
  }
  .searchbox::placeholder{color:var(--dim)}
  .searchbox:focus{outline:none;box-shadow:inset 0 0 0 1px var(--accent2),0 0 10px rgba(34,226,255,.25)}

  /* ---- live indicator + fleet switcher ---- */
  .livedot{width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 8px 2px var(--accent2);animation:livepulse 1.4s ease-in-out infinite;flex:none}
  @keyframes livepulse{0%,100%{opacity:1}50%{opacity:.3}}
  .fleetselect{
    background:var(--panel2);color:var(--fg);font-family:var(--mono);font-size:11.5px;
    padding:5px 8px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--line);
    text-transform:uppercase;letter-spacing:.02em;max-width:200px;
  }
  .fleetselect:focus{outline:none;box-shadow:inset 0 0 0 1px var(--accent2)}

  /* ---- reviewer attempts, side by side ---- */
  .diffgrid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:14px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
  .diffcol{background:var(--panel2);border-radius:10px;padding:13px 15px;box-shadow:inset 0 0 0 1px var(--line)}
  .diffcol-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .diffcol-bad{box-shadow:inset 0 0 0 1px rgba(255,61,127,.4)}
  .diffcol-ok{box-shadow:inset 0 0 0 1px rgba(57,255,157,.35)}
</style>
</head>
<body>

<header>
  <div class="brand">FleetView <small>graph_agents</small></div>
  <nav class="tabs" id="tabs">
    <button class="tab" data-view="runs" aria-selected="true">Runs</button>
    <button class="tab" data-view="portfolio" aria-selected="false">Portfolio</button>
    <button class="tab" data-view="roster" aria-selected="false">Roster</button>
  </nav>
  <div class="spacer"></div>
  <div class="ctl">
    <span id="livedot" class="livedot" title="a run is in progress — auto-refreshing every 4s" style="display:none"></span>
    <select id="fleetselect" class="fleetselect" title="switch fleet" style="display:none"></select>
    <span id="fleetpath" class="mono" title="fleet directory being read"></span>
    <span id="stamp" class="mono"></span>
    <button id="anon" title="Redact app names, home paths and emails everywhere — for screenshots. Prose naming an unknown app can still slip through.">Anonymize</button>
    <button id="refresh">Refresh</button>
  </div>
</header>

<!-- Connection trouble belongs above the tabs, not inside one view: the server can die
     while you are looking at Portfolio or Roster, and a banner buried in #rundetail
     would never be seen. -->
<div id="connbanner" class="banner connbanner" style="display:none"></div>

<main id="view-runs" class="active">
  <div class="runs-wrap">
    <div>
      <input id="runsearch" class="searchbox" type="text" placeholder="filter runs… (id, goal, app, status)" autocomplete="off">
      <div class="runlist" id="runlist"></div>
    </div>
    <div id="rundetail"></div>
  </div>
</main>

<main id="view-portfolio"></main>
<main id="view-roster"></main>

<script>
(function(){
"use strict";

var DATA = null;
var FLEETS = [];
var ACTIVE_FLEET = null;
var selectedRun = null;
var selectedNode = null;
var anon = false;
try { anon = localStorage.getItem("fleetview.anon") === "1"; } catch (e) {}
var runFilter = "";
var autoRefreshTimer = null;
var lastFingerprint = null;
/* One ETag per EXACT request URL, never one for the page. The list URL and a run's
   detail URL are different bodies with different tokens, and a single variable would
   let whichever answered last be sent back on the other -- a false 304, which is a
   live view frozen forever. The key already carries the fleet, the mode and the run
   id, so no two bodies can collide on it.
   THE INVARIANT: a token is stored with the body it describes and discarded in the
   same statement as that body. Keeping one past its body turns the next 304 into a
   blank pane no error path covers. */
var etags = {};
var runCache = {};                          // run_id -> {run, sig, url}: one run's depth, its signature, its ETag key
var detailError = {};                       // run_id -> a stated message, rendered INSIDE the detail pane
var pendingDetail = {};                     // run_id -> true while its one detail request is in flight
var cacheGen = 0;                           // bumped on every cache drop; a response from an older generation is dropped
var NOT_MODIFIED = {};                      // sentinel for "the server answered 304, there is no body"
var suppressHashPush = false;
var ACTIVE_STATUSES = ["scouting", "planning", "awaiting-approval", "building", "reviewing", "integrating"];
var VIEWS = ["runs", "portfolio", "roster"];
var currentView = "runs";

/* ---------- tiny helpers ---------- */

function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs){
    if (k === "class") n.className = attrs[k];
    /* Every visible string goes through scrub() here rather than at each call site --
       Anonymize has to hold everywhere, and "remember to anonymize this one too" is
       exactly the rule that failed for run ids and goals. */
    else if (k === "text") n.textContent = scrub(attrs[k]);
    else if (k === "html") n.innerHTML = attrs[k];
    else if (attrs[k] !== null && attrs[k] !== undefined){
      /* title is shown to a human; data-* and the rest are looked up by code and must
         keep their real values. */
      n.setAttribute(k, k === "title" ? scrub(attrs[k]) : attrs[k]);
    }
  }
  (kids || []).forEach(function(c){ if (c) n.appendChild(c); });
  return n;
}
function isEmpty(v){
  if (v === null || v === undefined || v === "") return true;
  if (Array.isArray(v)) return v.length === 0;
  if (typeof v === "object") return Object.keys(v).length === 0;
  return false;
}
function txt(v){
  if (v === null || v === undefined) return "";
  if (typeof v === "string") return v;
  return JSON.stringify(v, null, 2);
}

/* Anonymize is a safety feature, not a preference. Relabelling the `app` field is not
   enough: a run id (`2026-09-01-huntstack-mobile`), a goal sentence, a changed-file path
   and a state.json path all name the app just as plainly as registry.json does, and they
   are all on the default screen. So the toggle redacts every known identifier out of
   every string the page renders, applied inside `el()` — the one choke point every render
   already goes through, so a new render site cannot forget it.

   What it does NOT do: an app nobody registered, named only in prose, is not a token this
   can know about. This makes a screenshot safe to share; it is not a publication-grade
   redaction, and the button says relabel, not redact. */
var anonMap = null;       // exact id -> label
var anonLower = null;     // lowercased id -> label, for case-insensitive matching
var anonRe = null;

function reEscape(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

/* The fleet itself is not an app and keeps its name. */
function isFleetWord(id){ return id === "umbrella" || id === "graph_agents" || id === "repos"; }

/* A stem is the distinctive first segment of an id: `telosrg-site` is written `telosrg`
   in a bundle id, `koenrane.xyz` as `koenrane`, `whoop-med-tracker` as `whoop`. Generic
   segments are left alone -- redacting the word "personal" out of English prose costs
   more than it protects. */
var STEM_STOPLIST = ("personal shared common mobile desktop project service archive tracker "
                   + "site app apps web api core main data test docs tool tools my the").split(" ");

function stemOf(id){
  var first = id.split(/[-_.]/)[0];
  if (first.length < 5 || first === id) return null;
  if (STEM_STOPLIST.indexOf(first.toLowerCase()) !== -1) return null;
  return first;
}

function buildAnonMap(){
  anonMap = {}; anonLower = {};
  var ids = [], seen = {};
  function add(id){
    if (!id || typeof id !== "string" || isFleetWord(id) || seen[id]) return;
    seen[id] = true; ids.push(id);
  }
  ((DATA && DATA.portfolio && DATA.portfolio.apps) || []).forEach(function(a){ add(a.id); });
  /* Also whatever the runs claim, and every app directory beside the fleet: the registry
     shrank from 8 apps to 4, and a deregistered app's name is still all over the runs
     that touched it. A name the page never learns is one it cannot redact. */
  ((DATA && DATA.runs) || []).forEach(function(r){ add(r && r.app); });
  ((DATA && DATA.siblings) || []).forEach(add);

  ids.forEach(function(id, i){
    anonMap[id] = "App " + (i + 1);
    anonLower[id.toLowerCase()] = "App " + (i + 1);
  });

  /* Stems resolve to their parent id's label, so `telosrg` and `telosrg-site` read as
     the same app rather than two. */
  var tokens = ids.slice();
  ids.forEach(function(id){
    var stem = stemOf(id);
    if (stem && !anonLower[stem.toLowerCase()]){
      anonLower[stem.toLowerCase()] = anonMap[id];
      tokens.push(stem);
    }
  });

  /* Longest first, so `huntstack-mobile` is never half-matched by `huntstack`. */
  var byLen = tokens.sort(function(a, b){ return b.length - a.length; });
  anonRe = byLen.length ? new RegExp(byLen.map(reEscape).join("|"), "gi") : null;
}

function appLabel(id){
  if (!anon || !id) return id;
  if (isFleetWord(id)) return id;
  if (!anonMap) buildAnonMap();
  return anonMap[id] || "App ?";
}

/* An absolute path and an email address both carry a real person's name, which is a
   worse thing to put in a screenshot than an app id. Redacted on the same toggle. */
/* Separators are `+` because a path pasted inside JSON prose arrives with its
   backslashes doubled: `C:\\Users\\natha\\...`. */
var HOMEDIR_RE = /((?:[A-Za-z]:)?[\\\/]+(?:Users|home)[\\\/]+)([^\\\/\s"'`,;:)\]]+)/g;
var EMAIL_RE = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;

function scrub(s){
  if (!anon || typeof s !== "string" || !s) return s;
  if (!anonMap) buildAnonMap();
  /* Whole-token redactions run FIRST. An app id can be a substring of an address --
     `njcurtis3` inside `nathanjcurtis3@gmail.com` -- and replacing it mid-token would
     shred the address into a fragment the email pattern no longer matches, leaving the
     rest of a real name on screen. Take the whole token out, then relabel apps. */
  var out = s.replace(EMAIL_RE, "<email>").replace(HOMEDIR_RE, "$1<user>");
  return anonRe ? out.replace(anonRe, function(m){
    return anonLower[m.toLowerCase()] || "App ?";
  }) : out;
}

/* ---------- status mapping ---------- */

function runTone(status){
  switch(status){
    case "done": return "ok";
    case "blocked": case "unreadable": return "bad";
    case "parked": return "idle";
    default: return "warn";      // scouting, planning, awaiting-approval, building...
  }
}
function pill(text, tone, plain){
  return el("span", {class:"pill p-" + tone + (plain ? " plain" : ""), text:text});
}

/* ---------- freshness, scope exceptions, provenance ----------
   Three fields the fleet has written into every state.json for a long time and this
   page never showed: `_mtime`, `scope_exceptions` and `written_by`. Each is rendered
   as a decided signal rather than as the raw value, because on real data every one of
   them reads backwards if you show it literally. The filters below are the feature. */

function relSpan(secs){
  if (secs < 45)     return Math.max(0, Math.round(secs)) + "s";
  if (secs < 5400)   return Math.round(secs / 60) + "m";
  if (secs < 172800) return Math.round(secs / 3600) + "h";
  return Math.round(secs / 86400) + "d";
}

/* Age of the run's state.json in seconds, or null when there is no `_mtime` to read --
   an older serve.py, or a run whose state.json would not parse. */
function stateAgeSecs(run){
  var t = (run && run._mtime) ? Date.parse(run._mtime) : NaN;
  return isNaN(t) ? null : (Date.now() - t) / 1000;
}

/* Seconds since the newest heartbeat event, or null when the run has no activity.jsonl
   at all. Null is the ordinary answer, not a fault: the lane is optional in both
   directions and most runs predate it.

   Two shapes carry the same clock. A full run object carries `_activity`, and this
   reads it exactly as it always did, so nothing that already worked changes. A LIGHT
   ROW carries `_activity_last` instead: one number the server defines as the max over
   the very same `agents[].last` and `tail[].t` this loop walks. That equality is the
   whole reason the wedged pill can render off the run LIST, and it is asserted in
   test.js rather than assumed. */
function activityAgeSecs(run){
  if (!run) return null;
  var act = run._activity;
  if (act && act.error) return null;
  var newest = null;
  function keep(v){ if (typeof v === "number" && (newest === null || v > newest)) newest = v; }
  if (act){
    (act.agents || []).forEach(function(a){ keep(a.last); });
    (act.tail || []).forEach(function(e){ keep(e.t); });
  } else {
    keep(run._activity_last);
  }
  return newest === null ? null : (Date.now() / 1000 - newest);
}

/* A quiet state.json is NOT an idle run, and this must never be worded as though it
   were: a node writes state.json once, when it finishes, while activity.jsonl moves
   the whole time it is thinking. "state written 12m ago" mid-node is normal.
   What is worth an alarm is both clocks stopping at once on a run that still calls
   itself active — that is a *wedged* run, and `status` on its own cannot show it.
   A fleet that writes no heartbeat has only one clock, so nothing is claimed. */
var WEDGED_SECS = 15 * 60;

/* The statuses inside ACTIVE_STATUSES that are quiet BY DESIGN, because what they are
   waiting on is a person. A run parked at the human gate has both clocks stopped on
   purpose — no node is running, so nothing writes state.json and nothing appends to
   activity.jsonl — and calling that wedged after 15 minutes puts a red pill on every
   gated run, which teaches the reader to ignore the one case that is real. Every other
   entry in ACTIVE_STATUSES (scouting, planning, building, reviewing, integrating) names
   a node that is supposed to be working right now, so silence there IS the signal.
   Do not add a status here unless it is blocked on a human. */
var WAITING_ON_A_HUMAN = ["awaiting-approval"];

function wedgedFor(run){
  if (!run || ACTIVE_STATUSES.indexOf(run.status) === -1) return null;
  if (WAITING_ON_A_HUMAN.indexOf(run.status) !== -1) return null;
  var s = stateAgeSecs(run), a = activityAgeSecs(run);
  if (s === null || a === null) return null;
  if (s < WEDGED_SECS || a < WEDGED_SECS) return null;
  return Math.min(s, a);
}

/* An entry in `scope_exceptions` is only an exception if it is actually a path. Two
   kinds of prose live in the same array and neither one grants anything:
     - the schema's own docstring ("ORCHESTRATOR-OWNED, normally empty. ..."), which a
       fresh run copies verbatim, so an untouched run looks like it has one exception;
     - the orchestrator's "WHY (...)" rationale, which is required to accompany a real
       grant and therefore appears next to every genuine path.
   `len()` counts both. A contains-a-slash test also counts both, because the WHY prose
   quotes the very globs and endpoints it is explaining (`huntstack/apps/mobile/**`,
   `/api/graph`). And "has no spaces" is too strict in the other direction: a directory
   with a space in it (`huntstack/apps/My App/src/x.ts`) is a perfectly grantable path,
   and dropping it would silently under-report the one thing this block exists to show.
   So the test is prose-shape, not space-freedom — the two prose forms that actually
   occur announce themselves in their first word, and beyond that a sentence is long,
   punctuated and made of clauses, while a path is short and made of segments. */
var PROSE_OPENER = /^(WHY\b|ORCHESTRATOR-OWNED\b)/i;

function isRealPath(s){
  if (typeof s !== "string") return false;
  var t = s.trim();
  if (!t) return false;
  if (PROSE_OPENER.test(t)) return false;            // the WHY rationale and the schema docstring
  if (t.length > 160) return false;                  // too long to be a path anyone typed
  if (/[.,;:!?]$/.test(t)) return false;             // a path never ends on a full stop
  if (/[.!?]\s/.test(t)) return false;               // a sentence break inside it
  if (t.split(/\s+/).length > 4) return false;       // a path may hold a space; it is not a clause
  return /[\/\\]/.test(t) || /\.[A-Za-z0-9]{1,8}$/.test(t);
}

/* `scope_exceptions` is orchestrator-written prose-and-paths, so it can arrive as the
   wrong type entirely — and so can any single entry inside it. A crash here truncates the
   whole run detail to its header panel, and the rule for this reader is that a malformed
   input renders as a visible state. Both failures are silent in exactly the same way, so
   the members are tested as well as the type, and they return DIFFERENT kinds because they
   are not the same failure: "type" has nothing in it to read at all, while "member" still
   holds whatever real paths the rest of the list recorded. Note what is deliberately NOT
   malformed: a list of strings that all fail isRealPath() is the schema-docstring case,
   the ordinary state of a fresh run, and it renders no block. Returns "" when the field is
   fine or absent, so the caller can keep reading this as a plain truth test. */
function scopeExceptionsMalformed(run){
  var raw = run && run.scope_exceptions;
  if (raw === undefined || raw === null) return "";
  if (!Array.isArray(raw)) return "type";
  for (var i = 0; i < raw.length; i++){
    if (typeof raw[i] !== "string") return "member";
  }
  return "";
}
function realScopeExceptions(run){
  var raw = run && run.scope_exceptions;
  return Array.isArray(raw) ? raw.filter(isRealPath) : [];
}

/* The stamp each node kind is supposed to leave on its own state.json key. The human
   gate is not a key, so it has nothing to be stamped with and is absent here. */
var EXPECTED_STAMP = {
  scout:"scout", architect:"architect", builder:"builder",
  reviewer:"reviewer", integrator:"integrator", ops:"ops"
};
var STAMP_TEMPLATE = "the node that wrote this key";

function stampHolder(run, n){
  switch (n.kind){
    case "scout":      return run.scout;
    case "architect":  return run.architect;
    case "builder":    return (run.builders || {})[n.slice];
    case "reviewer":   return (run.reviews || {})[n.slice];
    case "integrator": return run.integrator;
    case "ops":        return run.ops;
    default:           return null;
  }
}

/* FOUR states, and telling them apart is the entire point. Counted across this fleet
   when the signal was built: 39 keys stamped correctly, 31 carrying no stamp at all,
   13 still holding the schema's placeholder, and ZERO genuine mismatches. A rule that
   reads "value !== expected" as forgery therefore paints 44 of 83 keys red on a fleet
   whose real forgery count is nil — and a warning that is wrong that often is one
   nobody reads. Only a stamp naming a DIFFERENT node is allowed to be loud. */
function provenanceOf(run, n){
  var expect = EXPECTED_STAMP[n.kind];
  var holder = stampHolder(run, n);
  if (!expect || !holder || typeof holder !== "object") return null;

  var v = holder.written_by;
  if (typeof v !== "string" || !v.trim()){
    return {state:"unstamped", loud:false, mark:"unstamped (legacy)",
            detail:"This key carries no written_by. Runs before 2026-08-26 predate the field entirely, " +
                   "so an unstamped key is history, not a fault."};
  }
  /* Checked BEFORE the match, because the placeholder sentence contains the very node
     name it is a placeholder for ("...always the string integrator") and would other-
     wise read as a correct stamp. */
  if (v.indexOf(STAMP_TEMPLATE) !== -1){
    return {state:"template", loud:false, mark:"unstamped (did not run)",
            detail:"written_by still holds the schema's placeholder text, which means this node never " +
                   "wrote the key — it did not run."};
  }
  if (v.trim().toLowerCase() === expect){
    return {state:"ok", loud:false, mark:null,
            detail:"written_by: " + v + " — stamped by the node that is allowed to write this key."};
  }
  return {state:"mismatch", loud:true, mark:"written_by: " + v,
          detail:"written_by names " + v + ", but only " + expect + " may write this key. " +
                 "Someone else wrote it, or one node rewrote another's — the exact thing " +
                 "verify-state.py --audit exists to catch."};
}

/* ---------- graph model for one run ---------- */

function sliceIds(run){
  var plan = (run.architect && run.architect.plan) || [];
  var ids = plan.map(function(p){ return p.slice; }).filter(Boolean);
  // builders may carry keys the plan never named (an authorized extra pass)
  Object.keys(run.builders || {}).forEach(function(k){
    if (ids.indexOf(k) === -1) ids.push(k);
  });
  return ids;
}

/* A rejected slice keeps attempt 1's REJECT at the top of reviews.<slice> and
   nests the re-review as attempt_2 (attempt_3, ...). The node must show the
   FINAL verdict, or a slice that was rejected and then fixed reads as failed. */
function reviewAttempts(r){
  if (!r) return [];
  var out = [{verdict:r.verdict, attempt:r.attempt || 1, summary:r.summary, findings:r.findings}];
  for (var i = 2; i < 10; i++){
    var a = r["attempt_" + i];
    if (!a) break;
    out.push({verdict:a.verdict, attempt:a.attempt || i, summary:a.summary, findings:a.findings});
  }
  return out;
}
function finalVerdict(r){
  var a = reviewAttempts(r);
  return a.length ? a[a.length - 1] : null;
}
function everRejected(r){
  return reviewAttempts(r).some(function(a){ return a.verdict === "REJECT"; });
}

/* "Live" marks the node the current status says is doing agent work RIGHT NOW, so the
   graph can pulse it -- distinct from "warn", which just means "not done yet" and covers
   states that are not running at all (queued behind a sequential slice, waiting on the
   human gate). Approximate by necessity: state.json has no field naming which specific
   slice a running builder/reviewer belongs to (activity.jsonl doesn't either -- see
   graph_agents' gap #20 neighborhood), so this infers from run.status plus what's still
   unwritten, never from a claimed duration or a heartbeat pairing.
     - a `diamond` spawns every slice's builder/reviewer together, so EVERY unwritten one
       for the current stage is plausibly running concurrently -- mark them all.
     - a `single-loop` runs slices in plan order, so at most ONE is actually running: the
       first still-unwritten one. Later queued slices stay idle, not pulsing, because
       claiming they're "alive" too would be a claim this data cannot back.
   The human gate is never live -- WAITING_ON_A_HUMAN means it's a person's turn, not an
   agent's, and pulsing a node waiting on YOU is exactly backwards. */
function buildNodes(run){
  var shape = (run.architect && run.architect.shape) || "";
  var isDiamond = shape === "diamond";
  var status = run.status;
  var humanTurn = WAITING_ON_A_HUMAN.indexOf(status) !== -1;
  var claimedSingleLoopLive = false;
  function liveFor(stage, unwritten){
    if (!unwritten || humanTurn || status !== stage) return false;
    if (isDiamond) return true;
    if (claimedSingleLoopLive) return false;
    claimedSingleLoopLive = true;
    return true;
  }

  var nodes = [];

  var scoutDone = !isEmpty(run.scout && run.scout.facts);
  nodes.push({id:"scout", name:"scout", sub:"haiku · recon",
              tone: scoutDone ? "ok" : "idle",
              state: scoutDone ? "done" : "not run", kind:"scout",
              live: liveFor("scouting", !scoutDone)});

  var archDone = !isEmpty(run.architect && run.architect.plan);
  nodes.push({id:"architect", name:"architect", sub:"opus · router",
              tone: archDone ? "ok" : "idle",
              state: archDone ? "done" : "not run", kind:"architect",
              live: liveFor("planning", !archDone)});

  nodes.push({id:"gate", name:"⛔ HUMAN GATE", sub: run.approved_by_human ? "approved" : "waiting",
              tone: run.approved_by_human ? "ok" : (archDone ? "warn" : "idle"),
              state: run.approved_by_human ? "approved" : "not approved", kind:"gate"});

  sliceIds(run).forEach(function(sid){
    var b = (run.builders || {})[sid] || null;
    var r = (run.reviews || {})[sid] || null;

    var btone = "idle", bstate = "not run";
    if (b){
      bstate = b.status || "unknown";
      btone = bstate === "done" ? "ok" : (bstate === "failed" ? "bad" : "warn");
    }
    nodes.push({id:"builder:"+sid, name:"builder", sub:sid, slice:sid,
                tone:btone, state:bstate, kind:"builder",
                live: liveFor("building", !b)});

    var rtone = "idle", rstate = "not run", rsub = sid;
    var fin = finalVerdict(r);
    if (fin){
      rstate = fin.verdict || "unknown";
      rtone = rstate === "PASS" ? "ok" : (rstate === "REJECT" ? "bad" : "warn");
      rsub = rstate + " · try " + fin.attempt;
      if (rstate === "PASS" && everRejected(r)) rstate = "PASS after a REJECT loop";
    }
    // a reviewer can't be running before its own builder finished, even if the run's
    // overall status has already advanced to "reviewing"
    nodes.push({id:"reviewer:"+sid, name:"reviewer", sub:rsub, slice:sid,
                tone:rtone, state:rstate, kind:"reviewer", looped:everRejected(r),
                live: liveFor("reviewing", !fin && bstate === "done")});
  });

  var intMerged = !isEmpty(run.integrator && run.integrator.merged);
  nodes.push({id:"integrator", name:"integrator", sub: isDiamond ? "merge point" : "not used · single-loop",
              tone: !isDiamond ? "idle" : (intMerged ? "ok" : "warn"),
              state: !isDiamond ? "skipped (single-loop needs no merge point)" : (intMerged ? "merged" : "pending"),
              kind:"integrator", off: !isDiamond,
              live: isDiamond && liveFor("integrating", !intMerged)});

  var opsRan = !isEmpty(run.ops && run.ops.actions);
  nodes.push({id:"ops", name:"ops", sub: opsRan ? "ran" : "gated · not run",
              tone: opsRan ? "ok" : "idle",
              state: opsRan ? "ran" : "gated, not invoked",
              kind:"ops", off: !opsRan});

  // One pass, so the node mark and the inspector never disagree about a key.
  nodes.forEach(function(n){ n.prov = provenanceOf(run, n); });

  return nodes;
}

/* ---------- rendering: the work graph ---------- */

function nodeEl(n){
  var b = el("button", {class:"node" + (n.kind === "gate" ? " gate" : "") + (n.off ? " off" : "") +
                        (n.live ? " live" : ""),
                        "data-node":n.id, type:"button"}, [
    n.kind === "gate" ? null : el("span", {class:"dot d-" + n.tone}),
    el("div", {class:"nname", text:n.name}),
    n.sub ? el("div", {class:"nsub", text:n.sub}) : null,
    /* A correctly stamped key gets no mark at all — the quiet state is the common one,
       and marking it would bury the one state that matters. */
    (n.prov && n.prov.mark) ? el("div", {class:"nprov" + (n.prov.loud ? " bad" : ""),
                                         text:n.prov.mark, title:n.prov.detail}) : null
  ]);
  if (selectedNode === n.id) b.setAttribute("aria-selected", "true");
  b.addEventListener("click", function(){
    selectedNode = (selectedNode === n.id) ? null : n.id;
    renderRunDetail();
    replaceHash();
  });
  return b;
}

function renderGraph(run){
  var nodes = buildNodes(run);
  var byId = {};
  nodes.forEach(function(n){ byId[n.id] = n; });
  var slices = sliceIds(run);
  var shape = (run.architect && run.architect.shape) || "";
  var isDiamond = shape === "diamond";

  var canvas = el("div", {class:"canvas"});
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  canvas.appendChild(svg);

  function row(children){
    var r = el("div", {class:"row"});
    children.forEach(function(c){ r.appendChild(c); });
    canvas.appendChild(r);
    return r;
  }
  function gap(){ canvas.appendChild(el("div", {class:"rowgap"})); }

  row([nodeEl(byId["scout"])]);          gap();
  row([nodeEl(byId["architect"])]);      gap();
  row([nodeEl(byId["gate"])]);           gap();

  if (slices.length){
    var lanes = slices.map(function(sid){
      return el("div", {class:"lane"}, [
        el("div", {class:"slicehead", text:sid}),
        nodeEl(byId["builder:"+sid]),
        el("div", {class:"rowgap"}),
        nodeEl(byId["reviewer:"+sid])
      ]);
    });
    row(lanes);
  } else {
    row([el("div", {class:"node off"}, [el("div",{class:"nname",text:"no slices yet"})])]);
  }
  gap();
  row([nodeEl(byId["integrator"])]); gap();
  row([nodeEl(byId["ops"])]);

  // Edges are measured after layout, so the DOM decides geometry, not a
  // hardcoded coordinate table.
  function draw(){
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var box = canvas.getBoundingClientRect();
    svg.setAttribute("viewBox", "0 0 " + box.width + " " + box.height);

    function rect(id){
      var e = canvas.querySelector('[data-node="' + CSS.escape(id) + '"]');
      if (!e) return null;
      var r = e.getBoundingClientRect();
      return {x:r.left - box.left, y:r.top - box.top, w:r.width, h:r.height};
    }
    // a glowing edge is one carrying a real result; DIM/idle edges stay flat
    // so the eye lands on what actually happened, not on the whole graph.
    function glowOf(color){ return (color === DIM || color === LINE) ? "none" : "drop-shadow(0 0 3px " + color + ")"; }
    function path(d, color, dashed, cls){
      var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", d);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", color);
      p.setAttribute("stroke-width", "1.6");
      p.setAttribute("style", "filter:" + glowOf(color));
      if (dashed) p.setAttribute("stroke-dasharray", "4 4");
      // a flowing edge gets its own, chunkier dash regardless of `dashed` -- the
      // animation is what reads as motion, and a 4 4 dash moves too fast to track.
      if (cls){ p.setAttribute("class", cls); p.setAttribute("stroke-dasharray", "8 6"); }
      svg.appendChild(p);
      return p;
    }
    function arrow(x, y, color){
      var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", "M" + (x-4) + " " + (y-6) + " L" + x + " " + y + " L" + (x+4) + " " + (y-6));
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", color);
      p.setAttribute("stroke-width", "1.6");
      p.setAttribute("style", "filter:" + glowOf(color));
      svg.appendChild(p);
    }
    // vertical-ish connector from bottom of a to top of b
    function connect(aId, bId, color, dashed, cls){
      var a = rect(aId), b = rect(bId);
      if (!a || !b) return;
      var x1 = a.x + a.w/2, y1 = a.y + a.h;
      var x2 = b.x + b.w/2, y2 = b.y;
      var d = (x1 === x2)
        ? "M" + x1 + " " + y1 + " L" + x2 + " " + y2
        : "M" + x1 + " " + y1 + " C" + x1 + " " + (y1 + (y2-y1)*0.55) + " " +
          x2 + " " + (y2 - (y2-y1)*0.55) + " " + x2 + " " + y2;
      path(d, color, dashed, cls);
      arrow(x2, y2, color);
    }
    // side loop: from b back up to a (the REJECT edge)
    function loopBack(fromId, toId, color){
      var f = rect(fromId), t = rect(toId);
      if (!f || !t) return;
      var x = f.x + f.w, xo = x + 22;
      var y1 = f.y + f.h/2, y2 = t.y + t.h/2;
      path("M" + x + " " + y1 + " C" + xo + " " + y1 + " " + xo + " " + y2 + " " + (t.x + t.w) + " " + y2,
           color, true);
      var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", "M" + (t.x + t.w + 6) + " " + (y2-4) + " L" + (t.x + t.w) + " " + y2 +
                          " L" + (t.x + t.w + 6) + " " + (y2+4));
      p.setAttribute("fill","none"); p.setAttribute("stroke",color); p.setAttribute("stroke-width","1.6");
      p.setAttribute("style", "filter:" + glowOf(color));
      svg.appendChild(p);
    }

    var LINE = "#332a5c", OK = "#22e2ff", BAD = "#ff3d7f", DIM = "#241a44", FLOW = "#ffb020";
    function tone(n){ return n && n.tone === "idle" ? DIM : (n && n.tone === "ok" ? OK : LINE); }
    // the edge INTO a live node gets the flow treatment instead of its flat tone --
    // this is the one place "not done yet" (flat) and "happening right now" (moving,
    // amber, glowing) stop looking identical.
    function edgeColor(id){ var n = byId[id]; return (n && n.live) ? FLOW : tone(n); }
    function edgeCls(id){ var n = byId[id]; return (n && n.live) ? "edge-flow" : null; }

    connect("scout", "architect", edgeColor("architect"), false, edgeCls("architect"));
    connect("architect", "gate", edgeColor("gate"), false, edgeCls("gate"));

    if (slices.length){
      if (isDiamond){
        slices.forEach(function(sid){
          connect("gate", "builder:"+sid, edgeColor("builder:"+sid), false, edgeCls("builder:"+sid));
        });
      } else {
        connect("gate", "builder:"+slices[0], edgeColor("builder:"+slices[0]), false, edgeCls("builder:"+slices[0]));
        for (var i = 0; i < slices.length - 1; i++){
          connect("reviewer:"+slices[i], "builder:"+slices[i+1],
                  edgeColor("builder:"+slices[i+1]), true, edgeCls("builder:"+slices[i+1]));
        }
      }
      slices.forEach(function(sid){
        connect("builder:"+sid, "reviewer:"+sid, edgeColor("reviewer:"+sid), false, edgeCls("reviewer:"+sid));
        if (everRejected((run.reviews || {})[sid])) loopBack("reviewer:"+sid, "builder:"+sid, BAD);
      });
      if (isDiamond){
        slices.forEach(function(sid){
          connect("reviewer:"+sid, "integrator", edgeColor("integrator"), false, edgeCls("integrator"));
        });
      } else {
        connect("reviewer:"+slices[slices.length-1], "integrator", DIM, true);
      }
    }
    connect("integrator", "ops", DIM, true);
  }

  requestAnimationFrame(draw);
  if (window.ResizeObserver){
    var ro = new ResizeObserver(function(){ draw(); });
    ro.observe(canvas);
  }
  window.addEventListener("resize", draw);

  var legend = el("div", {class:"legend"}, [
    el("span", {html:'<i style="background:var(--ok);color:var(--ok)"></i>done / PASS'}),
    el("span", {html:'<i style="background:var(--warn);color:var(--warn)"></i>in flight / awaiting'}),
    el("span", {html:'<i style="background:var(--bad);color:var(--bad)"></i>REJECT / failed'}),
    el("span", {html:'<i style="background:var(--idle);color:var(--idle)"></i>not run'}),
    el("span", {text:"pulsing node + moving amber edge = this stage is running right now (best-effort from status, not a heartbeat)"}),
    el("span", {text: isDiamond ? "solid = fan-out/fan-in · dashed red = REJECT loop"
                                : "dashed = sequential hand-off (single-loop) · dashed red = REJECT loop"}),
    el("span", {text:"written_by: a correct stamp is silent · unstamped is muted · a stamp naming another node is red"})
  ]);

  return el("div", {}, [canvas, legend]);
}

/* ---------- rendering: inspector for the selected node ---------- */

/* Long verbatim fields (builder gate_results, occasionally notes) are evidence, not
   prose — FleetView shows exactly what's on disk either way, just collapsed to a short
   excerpt by default so a human can skim first and expand to audit. */
var NOTE_EXCERPT_LEN = 260;

/* Which long fields the human has opened, keyed by run:node:field. The 4s auto-refresh
   rebuilds the detail pane from scratch, so without this an expanded gate_results
   collapses under you every 4 seconds — during a live run, which is exactly when you
   are reading it. Session-only on purpose: this is where you are looking right now,
   not a preference worth persisting. */
var expandedNotes = {};

function noteBlock(value, cls, key){
  var full = txt(value);
  if (full.length <= NOTE_EXCERPT_LEN) return el("p", {class:cls, text: full});

  var label = "show full (" + full.length.toLocaleString() + " chars)";
  var open = !!(key && expandedNotes[key]);
  var cut = full.slice(0, NOTE_EXCERPT_LEN).replace(/\s+\S*$/, "");
  var wrap = el("div", {class:"note-wrap"});
  var excerptP = el("p", {class:cls, text: cut + "…"});
  var fullP = el("p", {class:cls, text: full});
  excerptP.hidden = open;
  fullP.hidden = !open;
  var btn = el("button", {class:"note-toggle", type:"button", text: open ? "show less" : label});
  btn.addEventListener("click", function(){
    var showingFull = !fullP.hidden;
    fullP.hidden = showingFull;
    excerptP.hidden = !showingFull;
    btn.textContent = showingFull ? label : "show less";
    if (key){
      if (showingFull) delete expandedNotes[key];
      else expandedNotes[key] = true;
    }
  });
  wrap.appendChild(excerptP);
  wrap.appendChild(btn);
  wrap.appendChild(fullP);
  return wrap;
}

function listOf(items, cls){
  if (isEmpty(items)) return el("p", {class:"empty", text:"none recorded"});
  return el("ul", {class:"list"}, items.map(function(it){
    return el("li", {class:cls || "", text: typeof it === "string" ? it : txt(it)});
  }));
}

function kv(pairs){
  var d = el("dl", {class:"kv"});
  pairs.forEach(function(p){
    if (isEmpty(p[1])) return;
    d.appendChild(el("dt", {text:p[0]}));
    d.appendChild(el("dd", typeof p[1] === "string" ? {text:p[1]} : {}, typeof p[1] === "string" ? [] : [p[1]]));
  });
  return d;
}

function findingsList(findings){
  if (isEmpty(findings)) return null;
  return el("ul", {class:"findings", style:"margin-top:12px"}, findings.map(function(f){
    var sevTone = /crit|high|blocker/i.test(f.severity || "") ? "var(--bad)"
                : (/med/i.test(f.severity || "") ? "var(--warn)" : "var(--dim)");
    return el("li", {}, [
      f.severity ? el("span", {class:"sev", style:"color:" + sevTone, text:f.severity}) : null,
      el("div", {class:"loc", text:(f.file || "") + (f.line ? ":" + f.line : "")}),
      el("div", {text: txt(f.issue)})
    ]);
  }));
}
function attemptBlock(a, keyBase){
  var tone = a.verdict === "PASS" ? "ok" : (a.verdict === "REJECT" ? "bad" : "idle");
  var box = el("div", {});
  box.appendChild(el("h3", {text:"attempt " + a.attempt}));
  box.appendChild(el("div", {}, [pill(a.verdict || "unknown", tone)]));
  if (a.summary){
    var s = noteBlock(a.summary, "note", keyBase + ":summary:" + a.attempt);
    s.style.marginTop = "10px";
    box.appendChild(s);
  }
  var fl = findingsList(a.findings);
  if (fl) box.appendChild(fl);
  return box;
}
function attemptCol(a, keyBase){
  var tone = a.verdict === "PASS" ? "ok" : (a.verdict === "REJECT" ? "bad" : "idle");
  var col = el("div", {class:"diffcol " + (tone === "bad" ? "diffcol-bad" : tone === "ok" ? "diffcol-ok" : "")});
  col.appendChild(el("div", {class:"diffcol-head"}, [
    el("span", {class:"mono", style:"color:var(--dim);font-size:11px", text:"attempt " + a.attempt}),
    pill(a.verdict || "unknown", tone)
  ]));
  if (a.summary){
    var cs = noteBlock(a.summary, "note", keyBase + ":summary:" + a.attempt);
    cs.style.marginTop = "9px";
    col.appendChild(cs);
  }
  var fl = findingsList(a.findings);
  if (fl) col.appendChild(fl);
  else col.appendChild(el("p", {class:"empty", style:"margin-top:9px", text:"no findings recorded"}));
  return col;
}

function inspect(run, nodeId){
  var nodes = buildNodes(run), n = null;
  nodes.forEach(function(x){ if (x.id === nodeId) n = x; });
  if (!n) return null;

  /* Identifies this node's long fields across a re-render, so an expanded block survives
     the 4s poll. Run id is in the key because a node id alone repeats between runs. */
  var keyBase = (run.run_id || "?") + ":" + nodeId;

  var body = el("div", {});
  body.appendChild(el("h2", {text: n.name + (n.slice ? " · " + n.slice : "")}));
  body.appendChild(el("p", {class:"goal", text:"state: " + n.state}));
  if (n.prov){
    body.appendChild(el("p", {class:"note",
      style:"margin-top:6px;font-size:11.5px;color:" + (n.prov.loud ? "var(--bad)" : "var(--dim)"),
      text:"provenance — " + n.prov.detail}));
  }

  if (n.kind === "scout"){
    var s = run.scout || {};
    body.appendChild(el("h3", {text:"facts"}));      body.appendChild(listOf(s.facts, "fact"));
    body.appendChild(el("h3", {text:"unknowns"}));   body.appendChild(listOf(s.unknowns, "unknown"));
    body.appendChild(el("h3", {text:"risks"}));      body.appendChild(listOf(s.risks, "risk"));
  }

  if (n.kind === "architect"){
    var a = run.architect || {};
    body.appendChild(el("h3", {text:"shape"}));
    body.appendChild(kv([
      ["shape", a.shape || ""],
      ["parallel_safe", String(a.parallel_safe)],
      ["rationale", a.rationale || ""],
      ["edges", typeof a.edges === "string" ? a.edges : txt(a.edges)],
      ["isolation", a.isolation_decision || ""]
    ]));
    body.appendChild(el("h3", {text:"plan"}));
    if (isEmpty(a.plan)) body.appendChild(el("p", {class:"empty", text:"no plan"}));
    else a.plan.forEach(function(p){
      body.appendChild(el("div", {class:"findings"}, [
        el("ul", {class:"findings"}, [
          el("li", {}, [
            el("div", {class:"loc", text:p.slice}),
            el("div", {text:p.intent || ""}),
            isEmpty(p.files) ? null : el("div", {class:"at", style:"margin-top:8px;display:flex;gap:5px;flex-wrap:wrap"},
              p.files.map(function(f){ return el("span", {class:"tag", text:f}); })),
            p.done_when ? el("div", {class:"loc", style:"margin-top:8px", text:"done_when: " + p.done_when}) : null
          ])
        ])
      ]));
    });
    body.appendChild(el("h3", {text:"explicitly not doing"}));
    body.appendChild(listOf(a.not_doing));
  }

  if (n.kind === "gate"){
    body.appendChild(el("h3", {text:"why this gate exists"}));
    body.appendChild(el("p", {class:"note", text:
      "The shape, the slices, the edges and the NOT DOING list are shown here before any code is written. " +
      "This is the cheapest possible moment to change direction. approved_by_human is set only after the human actually says so."}));
    if (run.parked_note){
      body.appendChild(el("h3", {text:"parked note"}));
      body.appendChild(el("p", {class:"note", text:run.parked_note}));
    }
  }

  if (n.kind === "builder"){
    var b = (run.builders || {})[n.slice] || {};
    body.appendChild(el("h3", {text:"result"}));
    body.appendChild(kv([["status", b.status || ""], ["branch", b.branch || ""]]));
    body.appendChild(el("h3", {text:"changed"}));
    body.appendChild(listOf(b.changed));
    if (b.notes){ body.appendChild(el("h3", {text:"notes"})); body.appendChild(noteBlock(b.notes, "note", keyBase + ":notes")); }
    if (b.gate_results){ body.appendChild(el("h3", {text:"gate results"})); body.appendChild(noteBlock(b.gate_results, "note mono", keyBase + ":gate_results")); }
    if (b.deviation_from_approved_plan){
      body.appendChild(el("h3", {text:"deviation from approved plan"}));
      body.appendChild(noteBlock(b.deviation_from_approved_plan, "note", keyBase + ":deviation"));
    }
  }

  if (n.kind === "reviewer"){
    var r = (run.reviews || {})[n.slice] || null;
    var attempts = reviewAttempts(r);
    if (!attempts.length){
      body.appendChild(el("p", {class:"empty", text:"no review recorded"}));
    } else if (attempts.length === 1){
      body.appendChild(attemptBlock(attempts[0], keyBase));
    } else {
      body.appendChild(el("h3", {text:"attempts, side by side"}));
      body.appendChild(el("div", {class:"diffgrid"}, attempts.map(function(a){
        return attemptCol(a, keyBase);
      })));
    }
    body.appendChild(el("p", {class:"note", style:"margin-top:16px;color:var(--dim)", text:
      "Max two attempts per slice, then the run stops and escalates to a human. Every attempt is a fresh reviewer that never saw the code being written."}));
  }

  if (n.kind === "integrator"){
    var i = run.integrator || {};
    body.appendChild(el("h3", {text:"merged"}));      body.appendChild(listOf(i.merged));
    body.appendChild(el("h3", {text:"conflicts"}));   body.appendChild(listOf(i.conflicts));
    body.appendChild(el("h3", {text:"verification"}));
    body.appendChild(i.verification ? noteBlock(i.verification, "note mono", keyBase + ":verification")
                                    : el("p", {class:"empty", text:"none recorded"}));
  }

  if (n.kind === "ops"){
    var o = run.ops || {};
    body.appendChild(el("h3", {text:"actions"}));
    body.appendChild(listOf(o.actions));
    body.appendChild(el("p", {class:"note", style:"margin-top:14px", text:
      "ops always runs behind its own explicit human gate and is never invoked automatically at the end of a graph."}));
  }

  return el("div", {class:"panel"}, [body]);
}

/* ---------- rendering: run list + detail ---------- */

function matchesFilter(r, q){
  var hay = [r.run_id, r.goal, r.app, r.status].filter(Boolean).join(" ").toLowerCase();
  return hay.indexOf(q) !== -1;
}

function renderRunList(){
  var wrap = document.getElementById("runlist");
  wrap.innerHTML = "";
  var all = (DATA && DATA.runs) || [];
  var runs = runFilter ? all.filter(function(r){ return matchesFilter(r, runFilter); }) : all;

  if (!runs.length){
    var f = (DATA && DATA.fleet) || {};
    var msg = !f.found ? "no fleet directory"
            : (all.length ? 'no runs match "' + runFilter + '"' : "no runs under .graph/runs/");
    wrap.appendChild(el("p", {class:"empty", text: msg}));
    return;
  }
  runs.forEach(function(r){
    var tone = runTone(r.status);
    var live = ACTIVE_STATUSES.indexOf(r.status) !== -1;
    var card = el("button", {class:"runcard", type:"button"}, [
      el("div", {class:"id", text:r.run_id}),
      el("div", {class:"meta"}, [
        pill(r.status || "unknown", tone),
        live ? el("span", {class:"livedot", style:"box-shadow:0 0 6px 1px currentColor;color:var(--accent2)"}) : null,
        el("span", {class:"pill p-idle plain", text: appLabel(r.app) || "—"}),
        shapeOf(r) ? el("span", {class:"pill p-accent plain", text:shapeOf(r)}) : null
      ])
    ]);
    if (r.run_id === selectedRun) card.setAttribute("aria-selected", "true");
    card.addEventListener("click", function(){
      if (selectedRun !== r.run_id){ selectedRun = r.run_id; selectedNode = null; }
      /* Paint FIRST, from the row this list already holds, then ask for the depth.
         The pane is never blanked and the network is never awaited before painting;
         ensureRunDetail sends nothing at all when the run is already cached. */
      renderRunList(); renderRunDetail();
      pushHash();
      ensureRunDetail(r.run_id);
    });
    wrap.appendChild(card);
  });
}

/* The run the hash is pointing at, as a LIST ROW — light or full, whichever this
   server ships. Null means "the hash named a run this fleet does not have". */
function currentRow(){
  var runs = (DATA && DATA.runs) || [];
  /* The fallback to the first run survives only where it is honest: where nothing was
     asked for. A hash that NAMES a run must never silently render a different one.
     Every run this fleet has is in the list — the split is by depth, not by count — so
     a named run missing from it is genuinely not here, and showing runs[0] under its
     id would be worse than saying so. */
  if (selectedRun){
    for (var i = 0; i < runs.length; i++) if (runs[i].run_id === selectedRun) return runs[i];
    return null;
  }
  return runs[0] || null;
}

function rejectedSliceCount(run){
  var n = 0;
  Object.keys((run && run.reviews) || {}).forEach(function(k){
    if (everRejected(run.reviews[k])) n++;
  });
  return n;
}

/* `architect.shape` on a full run, the flat `_shape` on a light row. Flat on purpose:
   a stub `architect:{shape}` would be indistinguishable from a real one, and
   `run.architect.plan` would then read undefined and render an EMPTY slice list where
   a loading state belongs. */
function shapeOf(r){
  return (r && r.architect && r.architect.shape) || (r && r._shape) || "";
}

function renderRunDetail(){
  var host = document.getElementById("rundetail");
  host.innerHTML = "";
  var fb = fleetBanner();
  if (fb){ host.appendChild(fb); return; }
  var row = currentRow();
  if (!row){
    if (selectedRun && ((DATA && DATA.runs) || []).length){
      host.appendChild(el("div", {class:"panel"}, [
        el("h2", {text:selectedRun}),
        el("div", {class:"banner", style:"margin-top:10px", text:
          "This run is not in this fleet. The run list holds every run this fleet has, and " +
          selectedRun + " is not one of them — it may have been archived, or the link may belong " +
          "to another fleet."})
      ]));
      return;
    }
    host.appendChild(el("p", {class:"empty", text:"no runs to show"}));
    return;
  }
  selectedRun = row.run_id;

  if (row._error){
    host.appendChild(el("div", {class:"banner", text:row.run_id + " — " + row._error}));
    return;
  }

  /* `row` is what the list already has and is always here; `run` is the depth, which
     under a light list arrives per run and may still be in flight. The header below
     is built from the ROW alone, so a click paints every pill the list could tell you
     about with no network at all — including the slice and reject counts, which the
     row pre-computes so they do not pop in when the depth lands. */
  var run = runDetail(row);

  var counts = run ? {slices:sliceIds(run).length, rejects:rejectedSliceCount(run)}
                   : {slices:row._n_slices || 0, rejects:row._n_rejects || 0};
  var shape = shapeOf(run || row);

  /* When the run's state.json was last written, and — only when both this and the
     heartbeat have stopped on a run that still calls itself active — that the run is
     wedged. Deliberately never worded as "idle": see wedgedFor(). Read off the ROW,
     which carries both clocks in either shape and is the fresher of the two. */
  var stateAge = stateAgeSecs(row);
  var wedged = wedgedFor(row);

  host.appendChild(el("div", {class:"panel"}, [
    el("div", {style:"display:flex;align-items:center;gap:9px;flex-wrap:wrap"}, [
      el("h2", {text:row.run_id}),
      pill(row.status || "unknown", runTone(row.status)),
      el("span", {class:"pill p-idle plain", text: appLabel(row.app) || "—"}),
      shape ? el("span", {class:"pill p-accent plain", text:shape}) : null,
      el("span", {class:"pill p-idle plain", text:counts.slices + " slice" + (counts.slices === 1 ? "" : "s")}),
      counts.rejects ? el("span", {class:"pill p-bad", text:counts.rejects + " reject loop" + (counts.rejects === 1 ? "" : "s")}) : null,
      row.approved_by_human ? el("span", {class:"pill p-ok", text:"gate approved"})
                            : el("span", {class:"pill p-warn", text:"gate not approved"}),
      stateAge === null ? null
        : el("span", {class:"pill p-idle plain", title:"state.json last modified: " + row._mtime,
                      text:"state written " + relSpan(stateAge) + " ago"}),
      wedged === null ? null
        : el("span", {class:"pill p-bad",
                      title:"A node writes state.json only when it finishes, so a quiet state.json alone means " +
                            "nothing. Both this run's state.json and its activity heartbeat have stopped while " +
                            "its status still says it is running.",
                      text:"no state or activity for " + relSpan(wedged)})
    ]),
    el("p", {class:"goal", text:row.goal || ""}),
    el("p", {class:"loc mono", style:"color:var(--dim);font-size:11px;margin:10px 0 0", text:row._path || ""})
  ]));

  /* No depth yet: a stated panel exactly where the work graph will land, or the
     stated failure if this run's one request did not come back. Never a blank pane,
     and never the previous run's graph under this run's title. */
  if (!run){ host.appendChild(detailPendingPanel(row.run_id)); return; }

  /* Only entries that are really paths — see isRealPath(). A run whose only entry is
     the schema docstring has granted nothing and gets no block at all. */
  var exceptions = realScopeExceptions(run);
  var malformed = scopeExceptionsMalformed(run);
  /* Banner THEN block, not banner OR block. A junk member does not suppress the paths the
     rest of the list recorded: dropping them to report the junk would hide the very grants
     this panel exists to surface. A field that is not a list at all yields no paths anyway,
     so that banner is exclusive by construction rather than by an else. */
  if (malformed || exceptions.length){
    var scopeKids = [el("h2", {text:"scope exceptions"})];
    if (malformed){
      scopeKids.push(el("div", {class:"banner", style:"margin-top:10px", text: malformed === "type"
        ? "scope_exceptions is not a list in this run's state.json, so it cannot be read. " +
          "Fix the state, not the view."
        : "scope_exceptions holds an entry that is not a string in this run's state.json, so it cannot be " +
          "read in full — any paths below are only the ones that could be. Fix the state, not the view."}));
    }
    if (exceptions.length){
      scopeKids.push(el("div", {class:"banner", style:"margin-top:10px"}, [
        el("div", {text: exceptions.length + " path" + (exceptions.length === 1 ? "" : "s") +
          " a builder was allowed to write that the architect's approved plan does not list. Each one should be " +
          "paired with deviation_from_approved_plan on the slice that took it."})
      ].concat(exceptions.map(function(p){
        return el("div", {class:"scopepath mono", text:p});
      }))));
    }
    host.appendChild(el("div", {class:"panel"}, scopeKids));
  }

  host.appendChild(el("div", {class:"panel"}, [
    el("h2", {text:"work graph"}),
    el("p", {class:"goal", style:"margin-bottom:10px", text:"Click a node to inspect what it actually wrote into state.json."}),
    renderGraph(run)
  ]));

  if (selectedNode){
    var ins = inspect(run, selectedNode);
    if (ins) host.appendChild(ins);
  }

  var activity = renderActivity(run);
  if (activity) host.appendChild(activity);

  var logItems = run.log || [];
  host.appendChild(el("div", {class:"panel"}, [
    el("h2", {text:"log"}),
    isEmpty(logItems) ? el("p", {class:"empty", text:"empty"})
      : el("ul", {class:"log"}, logItems.map(function(line){
          var m = /^([a-z_]+):\s*(.*)$/i.exec(line);
          return el("li", {}, m ? [el("span", {class:"who", text:m[1]}), el("span", {text:" " + m[2]})]
                                : [el("span", {text:line})]);
        }))
  ]));
}

/* ---------- rendering: node activity ---------- */

// `state.json` records what each node CONCLUDED. The activity lane records what the
// nodes DID, minute by minute, and it is the only view here that can show a run while
// it is still moving. Optional by design: a fleet that writes no activity.jsonl, or a
// run older than the heartbeat, renders no lane at all rather than an empty one.

function clockOf(t){
  if (typeof t !== "number") return "";
  var d = new Date(t * 1000);
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}

function spanText(row){
  if (typeof row.first !== "number" || typeof row.last !== "number") return "";
  var secs = Math.max(0, Math.round(row.last - row.first));
  return secs < 60 ? secs + "s" : Math.floor(secs / 60) + "m" + (secs % 60) + "s";
}
